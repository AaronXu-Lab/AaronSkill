<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">AaronSkill — practical Agent Skills, ready to install</title>
  <desc id="desc">A modular skill collection that turns documented workflows into installable agent capabilities.</desc>

  <rect width="1200" height="400" rx="28" fill="#111318"/>
  <path d="M0 72H1200M720 0V400" stroke="#2B303A" stroke-width="1"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="56" y="48" fill="#9EA7B8" font-size="18" font-weight="600" letter-spacing="2">INSTALLABLE AGENT SKILLS</text>
    <text x="56" y="142" fill="#F5F7FA" font-size="68" font-weight="760">AaronSkill</text>
    <text x="56" y="188" fill="#C4CAD5" font-size="24">把真实工作流，封装成可发现、可验证、可复用的技能。</text>

    <g transform="translate(56 242)">
      <rect width="606" height="72" rx="14" fill="#191D24" stroke="#343B47"/>
      <circle cx="26" cy="24" r="5" fill="#FF6B6B"/>
      <circle cx="44" cy="24" r="5" fill="#FFD166"/>
      <circle cx="62" cy="24" r="5" fill="#63D69A"/>
      <text x="24" y="53" fill="#63D69A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">$</text>
      <text x="48" y="53" fill="#E8EBF0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">npx skills@latest add AaronXu-Lab/AaronSkill</text>
    </g>

    <text x="56" y="354" fill="#7F899B" font-size="18">DESIGN SYSTEMS · UI WORKFLOWS · PUBLISHING · CONTENT PACKAGING</text>
  </g>

  <g transform="translate(766 48)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <g>
      <rect width="378" height="84" rx="16" fill="#191D24" stroke="#3A4352"/>
      <rect width="6" height="84" rx="3" fill="#8B7CFF"/>
      <text x="28" y="34" fill="#8B7CFF" font-size="17" font-weight="700" letter-spacing="1.4">DESIGN CONTRACTS</text>
      <text x="28" y="62" fill="#EEF0F4" font-size="22" font-weight="650">Author · Audit · Govern</text>
    </g>

    <g transform="translate(0 106)">
      <rect width="378" height="84" rx="16" fill="#191D24" stroke="#3A4352"/>
      <rect width="6" height="84" rx="3" fill="#63D69A"/>
      <text x="28" y="34" fill="#63D69A" font-size="17" font-weight="700" letter-spacing="1.4">COMPONENT FLOW</text>
      <text x="28" y="62" fill="#EEF0F4" font-size="22" font-weight="650">Find → Select → Port</text>
    </g>

    <g transform="translate(0 212)">
      <rect width="378" height="84" rx="16" fill="#191D24" stroke="#3A4352"/>
      <rect width="6" height="84" rx="3" fill="#FFB86B"/>
      <text x="28" y="34" fill="#FFB86B" font-size="17" font-weight="700" letter-spacing="1.4">DELIVERABLES</text>
      <text x="28" y="62" fill="#EEF0F4" font-size="22" font-weight="650">Publish · Package · Verify</text>
    </g>

    <g transform="translate(0 330)">
      <circle cx="8" cy="8" r="8" fill="#63D69A"/>
      <path d="M4.5 8.2 7 10.7 12 5.7" fill="none" stroke="#111318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="14" fill="#9EA7B8" font-size="18">SKILL.md discovered by the open skills CLI</text>
    </g>
  </g>
</svg>
