<section class="ck-demo">
<h2>标准状态</h2>
<div class="ck-demo-stage ck-canvas" data-static-dots>
<figure><section class="ck-node" data-kind="decision">
  <header class="ck-card-bar"><svg class="ck-icon ck-kind-icon" aria-hidden="true"><use href="#ck-git-fork"/></svg><h2>登录后去哪里？</h2></header><p class="ck-decision-detail">登录、注册或续接成功后，按邀请、渠道与组织状态分流</p>
</section><figcaption>带判断依据</figcaption></figure><figure><section class="ck-node" data-kind="decision">
  <header class="ck-card-bar"><svg class="ck-icon ck-kind-icon" aria-hidden="true"><use href="#ck-git-fork"/></svg><h2>企业身份是什么状态？</h2></header>
</section><figcaption>只有问题</figcaption></figure><figure><section class="ck-node" data-kind="decision"><span class="ck-entry">入口 · 邀请链接</span>
  <header class="ck-card-bar"><svg class="ck-icon ck-kind-icon" aria-hidden="true"><use href="#ck-git-fork"/></svg><h2>邀请链接对当前账号是否有效？</h2></header>
</section><figcaption>作为子流程入口</figcaption></figure>
</div>
<ul class="ck-rules"><li>宽 260px，2px 强调色描边，圆角 16px，强调色浅底；标题强调色 16px / 600，可以换行。</li><li>判断依据 13px、行高 1.55，缩进与标题文字对齐（左 38px），不放进 info。</li><li>依据写全去向会把节点撑高、破坏连线指标；去向写在出边标签上。</li></ul>
</section>
