<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1250" viewBox="0 0 1200 1250" role="img">
<title>Android：四块执行流程</title><desc>真实浏览器前测和只读诊断列项，获准后按范围选择网络接管与DNS、应用分流与中转、时区、持久更新与验证；验收通过交付，失败恢复并复查。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52606d"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#203040;text-anchor:middle}.title{font-size:30px;font-weight:700}.label{font-size:18px;font-weight:600}.note{font-size:14px}.line,.join{fill:none;stroke:#52606d;stroke-width:2.5}.line{marker-end:url(#a)}</style>
<rect width="1200" height="1250" fill="#f7f9fb"/><text x="600" y="55" class="title">Android：四块执行流程</text>
<rect x="340" y="100" width="520" height="80" rx="14" fill="#ffffff" stroke="#9eacb8" stroke-width="2"/><text x="600.0" y="131" class="label">记录完整前测与设备基线</text><text x="600.0" y="159" class="note">真实浏览器分数、出口、时区与业务结果</text>
<rect x="340" y="230" width="520" height="80" rx="14" fill="#edf6ff" stroke="#287bbb" stroke-width="2"/><text x="600.0" y="261" class="label">只读诊断并列出具体调整项</text><text x="600.0" y="289" class="note">按目标列出已执行流程中的措施与恢复方式</text>
<polygon points="600,335 790,390 600,445 410,390" fill="#fff7e6" stroke="#c98312" stroke-width="2"/><text x="600" y="395" class="label">具体调整项获准？</text>
<rect x="870" y="350" width="280" height="80" rx="14" fill="#fff0ef" stroke="#c94b43" stroke-width="2"/><text x="1010.0" y="381" class="label">交付诊断，等待选择</text><text x="1010.0" y="409" class="note">仅诊断或待确认时停止</text>
<rect x="270" y="485" width="660" height="325" rx="14" fill="#ffffff" stroke="#9eacb8" stroke-width="2"/><text x="600" y="515" class="label">按获准范围选择四块</text>
<rect x="295" y="545" width="295" height="85" rx="14" fill="#edf6ff" stroke="#287bbb" stroke-width="2"/><text x="442.5" y="576" class="label">1. 网络接管与 DNS</text><text x="442.5" y="604" class="note">VPN接管、DoH与STUN路径</text>
<rect x="610" y="545" width="295" height="85" rx="14" fill="#edf6ff" stroke="#287bbb" stroke-width="2"/><text x="757.5" y="576" class="label">2. 应用分流与中转</text><text x="757.5" y="604" class="note">域名、进程路径与节点中转</text>
<rect x="295" y="665" width="295" height="85" rx="14" fill="#edf6ff" stroke="#287bbb" stroke-width="2"/><text x="442.5" y="696" class="label">3. 时区</text><text x="442.5" y="724" class="note">IANA、自动开关与浏览器核验</text>
<rect x="610" y="665" width="295" height="85" rx="14" fill="#edf6ff" stroke="#287bbb" stroke-width="2"/><text x="757.5" y="696" class="label">4. 持久更新与验证</text><text x="757.5" y="724" class="note">合并安装、完整后测及有限容错</text>
<text x="600" y="785" class="note">记录实际执行项目及验证等级</text>
<polygon points="600,865 790,920 600,975 410,920" fill="#fff7e6" stroke="#c98312" stroke-width="2"/><text x="600" y="925" class="label">效果及容错验收通过？</text>
<rect x="870" y="880" width="280" height="80" rx="14" fill="#fff0ef" stroke="#c94b43" stroke-width="2"/><text x="1010.0" y="911" class="label">恢复旧状态并复查</text><text x="1010.0" y="939" class="note">保存失败与独立恢复结果</text>
<rect x="340" y="1110" width="520" height="80" rx="14" fill="#edf9f1" stroke="#2e8b54" stroke-width="2"/><text x="600.0" y="1141" class="label">交付措施与前后结果</text><text x="600.0" y="1169" class="note">完整分数、失败恢复、验证等级及备份</text>
