<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img"><title>工作区 Claude 数据清理</title><desc>限定范围扫描，审查具体清单与已有授权，退出写入进程后复扫并核验身份，可恢复清理后复查；未授权停在清单，身份变化或失败停止剩余项。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52606d"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#203040;text-anchor:middle}.title{font-size:30px;font-weight:700}.label{font-size:18px;font-weight:600}.note{font-size:14px}.line{fill:none;stroke:#52606d;stroke-width:2.5;marker-end:url(#a)}.box{stroke-width:2;stroke:#287bbb;fill:#edf6ff}</style><rect width="1200" height="1200" fill="#f7f9fb"/><text x="600" y="55" class="title">工作区 Claude 数据清理</text><rect x="370" y="100" width="460" height="80" rx="14" class="box"/><text x="600" y="131" class="label">限定真实目录并扫描白名单</text><text x="600" y="159" class="note">不跟随链接，保护源码、设置与备份</text><rect x="370" y="250" width="460" height="80" rx="14" class="box"/><text x="600" y="281" class="label">展示具体清单与删除影响</text><text x="600" y="309" class="note">沿用用户选择，不将历史当普通缓存</text><rect x="370" y="510" width="460" height="80" rx="14" class="box"/><text x="600" y="541" class="label">退出写入进程后重新扫描</text><text x="600" y="569" class="note">路径、快照或授权范围变化需重审</text><rect x="370" y="660" width="460" height="80" rx="14" class="box"/><text x="600" y="691" class="label">执行前及逐项核对身份</text><text x="600" y="719" class="note">变化、进程重启或失败均停止剩余项</text><rect x="370" y="810" width="460" height="80" rx="14" class="box"/><text x="600" y="841" class="label">执行可恢复清理</text><text x="600" y="869" class="note">记录隔离位置或废纸篓恢复方式</text><rect x="370" y="960" width="460" height="80" rx="14" class="box"/><text x="600" y="991" class="label">复扫并交付实际结果</text><text x="600" y="1019" class="note">报告成功、失败、未执行项与恢复位置</text><polygon points="600,365 790,420 600,475 410,420" fill="#fff7e6" stroke="#c98312" stroke-width="2"/><text x="600" y="425" class="label">具体清理已有授权？</text><rect x="870" y="380" width="280" height="80" rx="14" fill="#fff0ef" stroke="#c94b43" stroke-width="2"/><text x="1010" y="410" class="label">提供清单，等待选择</text><text x="1010" y="438" class="note">扫描不授权实际删除</text><path d="M790 420H870" class="line"/><text x="838" y="405" class="note">否</text><text x="628" y="493" class="note">是</text><path d="M600 180V250" class="line"/><path d="M600 330V365" class="line"/><path d="M600 475V510" class="line"/><path d="M600 590V660" class="line"/><path d="M600 740V810" class="line"/><path d="M600 890V960" class="line"/></svg>