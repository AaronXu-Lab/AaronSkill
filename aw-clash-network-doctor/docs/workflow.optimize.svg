<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img"><title>诊断与优化（含系统时区）</title><desc>优化前完整 IPKK 分数，只读诊断，具体调整清单，批准后执行并验证后测，失败回滚。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52606d"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#203040;text-anchor:middle}.title{font-size:30px;font-weight:700}.label{font-size:18px;font-weight:600}.note{font-size:14px}.line{fill:none;stroke:#52606d;stroke-width:2.5;marker-end:url(#a)}</style><rect width="1200" height="1200" fill="#f7f9fb"/><text x="600" y="55" class="title">诊断与优化（含系统时区）</text><rect x="360" y="100" width="480" height="80" rx="14" fill="#edf6ff" stroke="#287bbb" stroke-width="2"/><text x="600.0" y="131" class="label">记录优化前 IPKK 完整检测</text><text x="600.0" y="159" class="note">目标设备真实浏览器：分数、出口与时区</text><rect x="360" y="235" width="480" height="80" rx="14" fill="#edf6ff" stroke="#287bbb" stroke-width="2"/><text x="600.0" y="266" class="label">只读诊断并列出具体调整项</text><text x="600.0" y="294" class="note">现状、证据、建议、影响、验证与恢复方式</text><rect x="360" y="490" width="480" height="80" rx="14" fill="#edf6ff" stroke="#287bbb" stroke-width="2"/><text x="600.0" y="521" class="label">执行获准项并核对实际状态</text><text x="600.0" y="549" class="note">电脑 / Android：分流、DNS、时区及订阅合并</text><rect x="360" y="625" width="480" height="80" rx="14" fill="#edf6ff" stroke="#287bbb" stroke-width="2"/><text x="600.0" y="656" class="label">完整后测与相关业务验证</text><text x="600.0" y="684" class="note">记录实际分数和差值，不挑最高分</text><rect x="360" y="995" width="480" height="80" rx="14" fill="#edf6ff" stroke="#287bbb" stroke-width="2"/><text x="600.0" y="1026" class="label">交付项目状态与前后对比</text><text x="600.0" y="1054" class="note">分数仅作辅助；列出恢复状态与残留问题</text><polygon points="600,350 790,405 600,460 410,405" fill="#fff7e6" stroke="#c98312" stroke-width="2"/><text x="600" y="410" class="label">具体调整项获准？</text><rect x="870" y="365" width="280" height="80" rx="14" fill="#fff0ef" stroke="#c94b43" stroke-width="2"/><text x="1010.0" y="396" class="label">交付诊断，等待选择</text><text x="1010.0" y="424" class="note">仅诊断 / 拒绝时停止</text><polygon points="600,755 790,810 600,865 410,810" fill="#fff7e6" stroke="#c98312" stroke-width="2"/><text x="600" y="815" class="label">实际效果与验证通过？</text><rect x="870" y="775" width="280" height="80" rx="14" fill="#fff0ef" stroke="#c94b43" stroke-width="2"/><text x="1010.0" y="806" class="label">恢复旧状态并复查</text><text x="1010.0" y="834" class="note">回滚结果与优化后测分别记录</text><path d="M600 180V235" class="line"/><path d="M600 315V350" class="line"/><path d="M790 405H870" class="line"/><path d="M600 460V490" class="line"/><path d="M600 570V625" class="line"/><path d="M600 705V755" class="line"/><path d="M790 810H870" class="line"/><path d="M600 865V995" class="line"/><path d="M1010 855V950H600V995" class="line"/><text x="830" y="391" class="note">否</text><text x="633" y="480" class="note">是</text><text x="829" y="798" class="note">否</text><text x="630" y="897" class="note">是</text></svg>