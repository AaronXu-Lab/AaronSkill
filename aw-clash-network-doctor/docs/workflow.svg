<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img"><title>按目的组织：清理 / 诊断与优化</title><desc>清理独立；诊断优化按网络接管与DNS、应用分流与中转、时区、持久更新与验证四块选择获准项目，记录完整前后结果。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52606d"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#203040;text-anchor:middle}.title{font-size:30px;font-weight:700}.label{font-size:18px;font-weight:600}.note{font-size:14px}.line{fill:none;stroke:#52606d;stroke-width:2.5;marker-end:url(#a)}</style><rect width="1200" height="620" fill="#f7f9fb"/><text x="600" y="55" class="title">按目的组织：清理 / 诊断与优化</text><rect x="400" y="130" width="400" height="80" rx="14" fill="#edf6ff" stroke="#287bbb" stroke-width="2"/><text x="600.0" y="161" class="label">确定本次目的</text><text x="600.0" y="189" class="note">单纯解释只回答，不触发写入</text><rect x="100" y="340" width="450" height="80" rx="14" fill="#edf6ff" stroke="#287bbb" stroke-width="2"/><text x="325.0" y="371" class="label">Claude 数据清理</text><text x="325.0" y="399" class="note">限定范围 → 扫描 → 用户选择 → 清理复查</text><a href="workflow.cleanup.svg"><text x="325" y="455" class="note">workflow.cleanup.svg</text></a><rect x="650" y="340" width="450" height="80" rx="14" fill="#edf6ff" stroke="#287bbb" stroke-width="2"/><text x="875.0" y="371" class="label">四块诊断与优化</text><text x="875.0" y="399" class="note">网络与DNS · 应用与中转 · 时区 · 更新验证</text><a href="workflow.optimize.svg"><text x="875" y="455" class="note">workflow.optimize.svg</text></a><path d="M600 210V270H325V340" class="line"/><path d="M600 270H875V340" class="line"/><text x="600" y="530" class="note">两条线分别授权；清理不触发网络优化，优化不附带数据清理。</text></svg>