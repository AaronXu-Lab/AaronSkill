<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
  <title id="title">Comic dossier packing workflow</title><desc id="desc">Resolve output, collect covers, stop for the enhancement decision, gather seven introduction sources, generate social cards, assemble and clean the final dossier.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#52606d"/></marker><style>.h{font:700 30px -apple-system,BlinkMacSystemFont,sans-serif;fill:#17212b}.l{font:600 18px -apple-system,BlinkMacSystemFont,sans-serif;fill:#17212b;text-anchor:middle}.d{font:400 14px -apple-system,BlinkMacSystemFont,sans-serif;fill:#52606d;text-anchor:middle}.b{fill:#fff;stroke:#9eacb8;stroke-width:2}.x{fill:#edf6ff;stroke:#287bbb;stroke-width:2}.q{fill:#fff7e6;stroke:#c98312;stroke-width:2}.s{fill:#fff0ef;stroke:#c94b43;stroke-width:2}.g{fill:#edf9f1;stroke:#2e8b54;stroke-width:2}.p{fill:none;stroke:#52606d;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="1040" fill="#f7f9fb"/><text class="h" x="600" y="48" text-anchor="middle">Comic Dossier Packer</text>
  <rect class="b" x="420" y="80" width="360" height="64" rx="14"/><text class="l" x="600" y="108">Resolve task directory</text><text class="d" x="600" y="130">State the absolute output path</text><path class="p" d="M600 144V185"/>
  <rect class="x" x="420" y="185" width="360" height="64" rx="14"/><text class="l" x="600" y="213">Collect original covers</text><text class="d" x="600" y="235">Retry aliases or resolve title matches</text><path class="p" d="M600 249V290"/>
  <polygon class="q" points="600,290 790,350 600,410 410,350"/><text class="l" x="600" y="346">Skip enhancement?</text><text class="d" x="600" y="370">Blocking user decision with cost estimate</text>
  <path class="p" d="M790 350H850"/><rect class="s" x="850" y="315" width="300" height="70" rx="14"/><text class="l" x="1000" y="345">Wait for user answer</text><text class="d" x="1000" y="367">No later stage may start</text>
  <path class="p" d="M600 410V450"/><rect class="x" x="420" y="450" width="360" height="64" rx="14"/><text class="l" x="600" y="478">Keep originals or enhance</text><text class="d" x="600" y="500">Track failures and Gemini estimate</text>
  <path class="p" d="M600 514V555"/><rect class="x" x="420" y="555" width="360" height="64" rx="14"/><text class="l" x="600" y="583">Synthesize introduction</text><text class="d" x="600" y="605">Read seven source entry pages</text>
  <path class="p" d="M600 619V660"/><rect class="x" x="420" y="660" width="360" height="64" rx="14"/><text class="l" x="600" y="688">Run optional humanizer</text><text class="d" x="600" y="710">Skip cleanly when unavailable</text>
  <path class="p" d="M600 724V765"/><rect class="x" x="420" y="765" width="360" height="64" rx="14"/><text class="l" x="600" y="793">Generate social cards</text><text class="d" x="600" y="815">Direct ImageGen plus optional variants</text>
  <path class="p" d="M600 829V870"/><rect class="x" x="420" y="870" width="360" height="64" rx="14"/><text class="l" x="600" y="898">Assemble Markdown dossier</text><text class="d" x="600" y="920">Intro · cards · covers · seven citations</text>
  <path class="p" d="M600 934V965"/><rect class="g" x="430" y="965" width="340" height="60" rx="30"/><text class="l" x="600" y="1001">Clean folder and report</text>
</svg>
