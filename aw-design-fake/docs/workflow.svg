<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1430" role="img" aria-labelledby="title desc">
  <title id="title">AW Design Fake 工作流程</title>
  <desc id="desc">按任务确认 fake 需求与项目现状、读取必要资料；仅展示源码且无 bundle 时从唯一文本资产接入已有 fixture，仅审查时只读报告；修改时沿用已授权目录，保留较新项目版本，否则准备 bundle 并按占位操作、占位内容或演示状态实现；全局字段不足时核对已有维护授权，缺少必要授权才确认；源码仅展示不执行，隔离真实业务，修复并验证本次分支后交付。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#52606d"/>
    </marker>
    <style>
      .canvas { fill: #f7f9fb; }
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #1f2933; }
      .subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #60717f; }
      .label { font: 600 18px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #1f2933; text-anchor: middle; }
      .detail { font: 400 14px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #52606d; text-anchor: middle; }
      .branch { font: 600 14px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #52606d; }
      .link { fill: none; stroke: #52606d; stroke-width: 2.5; marker-end: url(#arrow); }
      .route { fill: none; stroke: #52606d; stroke-width: 2.5; }
      .input { fill: #ffffff; stroke: #9eacb8; stroke-width: 2; }
      .step { fill: #edf6ff; stroke: #287bbb; stroke-width: 2; }
      .judge { fill: #fff7e6; stroke: #c98312; stroke-width: 2; }
      .fix { fill: #fff0ef; stroke: #c94b43; stroke-width: 2; }
      .done { fill: #edf9f1; stroke: #2e8b54; stroke-width: 2; }
    </style>
  </defs>

  <rect class="canvas" width="1200" height="1430"/>
  <text class="title" x="600" y="54" text-anchor="middle">AW Design Fake</text>
  <text class="subtitle" x="600" y="82" text-anchor="middle">统一内容入口，源码只展示不执行，fake 与真实业务隔离</text>

  <!-- 只读审查绕过所有写入阶段 -->
  <path class="link" d="M870 270 H920"/>
  <path class="link" d="M1155 270 H1180 V1310 H870"/>
  <rect class="input" x="920" y="225" width="235" height="90" rx="14"/>
  <text class="label" x="1037" y="261">仅审查：报告差异</text>
  <text class="detail" x="1037" y="288">只读检查，不初始化或同步</text>
  <text class="branch" x="618" y="340">修改</text>

  <!-- 主流程与分支连线 -->
  <path class="link" d="M600 190 V225"/>
  <path class="link" d="M600 315 V350"/>
  <path class="link" d="M600 490 V565"/>
  <path class="link" d="M800 420 H865"/>
  <path class="route" d="M1010 510 V540 H600"/>
  <circle cx="600" cy="540" r="4" fill="#52606d"/>
  <path class="link" d="M400 420 H340"/>
  <path class="route" d="M190 475 V685 H25 V900 H600"/>

  <path class="link" d="M430 635 H200 V745"/>
  <path class="link" d="M600 705 V745"/>
  <path class="link" d="M770 635 H1000 V745"/>

  <path class="route" d="M200 845 V900 H600"/>
  <path class="route" d="M600 885 V900"/>
  <path class="route" d="M1000 845 V900 H600"/>
  <circle cx="600" cy="900" r="4" fill="#52606d"/>
  <path class="link" d="M600 900 V940"/>
  <path class="link" d="M600 1030 V1065"/>

  <path class="link" d="M400 1135 H340"/>
  <path class="link" d="M600 1205 V1260"/>
  <path class="link" d="M40 1135 H15 V985 H330"/>

  <!-- 节点 -->
  <rect class="input" x="330" y="110" width="540" height="80" rx="14"/>
  <text class="label" x="600" y="143">确认任务属于原型 fake</text>
  <text class="detail" x="600" y="168">排除测试 mock 与正式生产实现</text>

  <rect class="step" x="330" y="225" width="540" height="90" rx="14"/>
  <text class="label" x="600" y="261">按任务了解项目现状</text>
  <text class="detail" x="600" y="288">复用有效约定，仅加载本次分支的资料</text>

  <polygon class="judge" points="600,350 800,420 600,490 400,420"/>
  <text class="label" x="600" y="414">共享 fake 能力已就绪？</text>
  <text class="detail" x="600" y="440">统一入口、内容与项目适配是否可用</text>
  <text class="branch" x="620" y="520">是</text>
  <text class="branch" x="820" y="405">需处理</text>

  <rect class="step" x="40" y="365" width="300" height="110" rx="14"/>
  <text class="label" x="190" y="402">仅源码：复用已有入口</text>
  <text class="detail" x="190" y="430">无 bundle 时接入唯一文本资产</text>
  <text class="detail" x="190" y="453">沿用 fixture，不初始化运行能力</text>
  <text class="branch" x="350" y="405">仅源码</text>

  <rect class="step" x="865" y="365" width="290" height="145" rx="14"/>
  <text class="label" x="1010" y="402">准备共享能力</text>
  <text class="detail" x="1010" y="430">目录已定则初始化，缺失才询问</text>
  <text class="detail" x="1010" y="454">保留较新项目版本，不自动回写</text>
  <text class="detail" x="1010" y="478">过期同步；保留扩展与适配层</text>

  <polygon class="judge" points="600,565 770,635 600,705 430,635"/>
  <text class="label" x="600" y="629">需要哪一类 fake？</text>
  <text class="detail" x="600" y="655">选择满足需求的最小层级</text>
  <text class="branch" x="340" y="620">占位操作</text>
  <text class="branch" x="615" y="730">占位内容</text>
  <text class="branch" x="805" y="620">演示状态</text>

  <rect class="step" x="55" y="745" width="290" height="100" rx="14"/>
  <text class="label" x="200" y="782">A · 统一操作反馈</text>
  <text class="detail" x="200" y="810">可交互，但不触发真实写操作</text>

  <rect class="step" x="455" y="745" width="290" height="140" rx="14"/>
  <text class="label" x="600" y="782">B · 统一占位内容</text>
  <text class="detail" x="600" y="810">文案与完整源码走唯一数据源</text>
  <text class="detail" x="600" y="835">缺字段：按已有授权维护全局资产</text>
  <text class="detail" x="600" y="860">缺少必要授权：确认后再修改</text>

  <rect class="step" x="855" y="745" width="290" height="100" rx="14"/>
  <text class="label" x="1000" y="782">C · 可关闭演示状态</text>
  <text class="detail" x="1000" y="810">支持跨界面联动与一致关闭</text>

  <rect class="step" x="330" y="940" width="540" height="90" rx="14"/>
  <text class="label" x="600" y="976">隔离真实业务</text>
  <text class="detail" x="600" y="1003">源码不执行；fake 不写真实对象、不改变正式契约</text>

  <polygon class="judge" points="600,1065 800,1135 600,1205 400,1135"/>
  <text class="label" x="600" y="1129">行为与关闭验证通过？</text>
  <text class="detail" x="600" y="1155">按本次分支验证保真、交互与真实隔离</text>
  <text class="branch" x="355" y="1120">否</text>
  <text class="branch" x="620" y="1235">是</text>

  <rect class="fix" x="40" y="1090" width="300" height="90" rx="14"/>
  <text class="label" x="190" y="1126">修正后重新验证</text>
  <text class="detail" x="190" y="1153">在已授权范围内修复受影响项</text>

  <rect class="done" x="330" y="1260" width="540" height="105" rx="14"/>
  <text class="label" x="600" y="1300">交付审查报告或最小 fake 实现</text>
  <text class="detail" x="600" y="1328">说明分支、源码入口、版本与验证结果</text>
</svg>
