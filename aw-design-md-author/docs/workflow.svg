<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">DESIGN.md authoring workflow</title><desc id="desc">Read the canonical references, select ownership, author the complete contract, lint and diff it, then report external checks.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#52606d"/></marker><style>.h{font:700 30px -apple-system,BlinkMacSystemFont,sans-serif;fill:#17212b}.l{font:600 18px -apple-system,BlinkMacSystemFont,sans-serif;fill:#17212b;text-anchor:middle}.d{font:400 14px -apple-system,BlinkMacSystemFont,sans-serif;fill:#52606d;text-anchor:middle}.b{fill:#fff;stroke:#9eacb8;stroke-width:2}.x{fill:#edf6ff;stroke:#287bbb;stroke-width:2}.q{fill:#fff7e6;stroke:#c98312;stroke-width:2}.s{fill:#fff0ef;stroke:#c94b43;stroke-width:2}.g{fill:#edf9f1;stroke:#2e8b54;stroke-width:2}.p{fill:none;stroke:#52606d;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="900" fill="#f7f9fb"/><text class="h" x="600" y="48" text-anchor="middle">AW DESIGN.md Author</text>
  <rect class="b" x="420" y="80" width="360" height="64" rx="14"/><text class="l" x="600" y="108">Read required references</text><text class="d" x="600" y="130">Schema · lint rules · conventions</text><path class="p" d="M600 144V190"/>
  <rect class="x" x="420" y="190" width="360" height="64" rx="14"/><text class="l" x="600" y="218">Inspect project and contract</text><text class="d" x="600" y="240">Existing file · themes · distribution</text><path class="p" d="M600 254V300"/>
  <polygon class="q" points="600,300 790,360 600,420 410,360"/><text class="l" x="600" y="356">Choose ownership mode</text><text class="d" x="600" y="380">Standalone · code-backed · generated</text>
  <path class="p" d="M600 420V465"/><rect class="x" x="420" y="465" width="360" height="64" rx="14"/><text class="l" x="600" y="493">Author complete contract</text><text class="d" x="600" y="515">Normative YAML and canonical sections</text>
  <path class="p" d="M600 529V575"/><rect class="x" x="420" y="575" width="360" height="64" rx="14"/><text class="l" x="600" y="603">Check semantic integrity</text><text class="d" x="600" y="625">Names · references · contrast · parity</text>
  <path class="p" d="M600 639V685"/><rect class="x" x="420" y="685" width="360" height="64" rx="14"/><text class="l" x="600" y="713">Run lint and diff gate</text><text class="d" x="600" y="735">Errors block completion</text>
  <path class="p" d="M780 717H850"/><rect class="s" x="850" y="682" width="300" height="70" rx="14"/><text class="l" x="1000" y="712">Lint errors?</text><text class="d" x="1000" y="734">Fix and rerun before delivery</text>
  <path class="p" d="M600 749V790"/><rect class="g" x="450" y="790" width="300" height="60" rx="30"/><text class="l" x="600" y="826">Report result and external checks</text>
</svg>
