<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title id="title">设计流程入口</title><desc id="desc">帮助请求只展示说明并结束。正常输入依次进行塑形、初版生成、信息与组件审查、流程完整性审查；人工 Review 后修复，交接独立新会话走查，再经人工 Review 和获准修复，最后做文案收敛。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52606d"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;text-anchor:middle;fill:#203243}.heading{font-size:30px;font-weight:700}.label{font-size:18px;font-weight:600}.note{font-size:14px}.box{stroke-width:2}.input{fill:#fff;stroke:#9eacb8}.stage{fill:#edf6ff;stroke:#287bbb}.done{fill:#edf9f1;stroke:#2e8b54}.gate{fill:#fff7e6;stroke:#c98312;stroke-width:2}.wait{fill:#fff0ef;stroke:#c94b43}.edge{fill:none;stroke:#52606d;stroke-width:2.5;marker-end:url(#arrow)}</style>
<rect width="1200" height="1200" fill="#f7f9fb"/>
<text x="600" y="43" class="heading">AW Design Orchestrator · 设计流程入口</text>
<text x="600" y="72" class="note">按顺序调用既有 Skill · 保留人工决定 · 帮助单独触发</text>
<rect x="370" y="95" width="460" height="50" rx="14" class="box input"/><text x="600" y="127" class="label">输入需求 / 继续 / 帮助</text>
<path d="M600 145V160" class="edge"/>
<path d="M600 160L745 200L600 240L455 200Z" class="gate"/><text x="600" y="206" class="label">是 /help？</text>
<path d="M455 200H290" class="edge"/><text x="370" y="186" class="note">是</text>
<rect x="30" y="170" width="260" height="68" rx="14" class="box done"/><text x="160" y="198" class="label">展示帮助并结束</text><text x="160" y="221" class="note">不启动任务，不推进待确认阶段</text>
<path d="M600 240V275" class="edge"/><text x="621" y="263" class="note">否</text>
<rect x="350" y="275" width="500" height="60" rx="14" class="box stage"/><text x="600" y="301" class="label">aw-design-shaping</text><text x="600" y="324" class="note">理解与探索 → 用户确认设计方向</text>
<path d="M600 335V365" class="edge"/>
<rect x="350" y="365" width="500" height="55" rx="14" class="box stage"/><text x="600" y="389" class="label">组件库 + DESIGN.md → 可交互初版</text><text x="600" y="410" class="note">当前执行者实现</text>
<path d="M600 420V450" class="edge"/>
<rect x="350" y="450" width="500" height="70" rx="14" class="box stage"/><text x="600" y="475" class="label">信息简化 → 组件与交互修正</text><text x="600" y="500" class="note">aw-ux-info-redundancy-audit → aw-component-checker</text>
<path d="M600 520V550" class="edge"/>
<rect x="350" y="550" width="500" height="60" rx="14" class="box stage"/><text x="600" y="576" class="label">aw-flow-completeness-audit</text><text x="600" y="599" class="note">审查分支、状态、交接与恢复</text>
<path d="M600 610V645" class="edge"/>
<path d="M600 645L780 685L600 725L420 685Z" class="gate"/><text x="600" y="691" class="label">人工 Review 已处理？</text>
<path d="M780 685H1035V720" class="edge"/><text x="825" y="672" class="note">否</text>
<rect x="900" y="720" width="270" height="90" rx="14" class="box wait"/><text x="1035" y="749" class="label">等待用户审阅与决定</text><text x="1035" y="773" class="note">获准修改后实施并复查</text><text x="1035" y="796" class="note">仅认可报告不等于授权修复</text>
<path d="M600 725V760" class="edge"/><text x="695" y="748" class="note">是，已完成获准修复</text>
<rect x="350" y="760" width="500" height="65" rx="14" class="box stage"/><text x="600" y="787" class="label">新会话：aw-task-walkthrough</text><text x="600" y="812" class="note">准备交接 → 用户启动、选任务 → 实际走查</text>
<path d="M600 825V860" class="edge"/>
<path d="M600 860L780 900L600 940L420 900Z" class="gate"/><text x="600" y="906" class="label">人工 Review 已处理？</text>
<path d="M780 900H1035V810" class="edge"/><text x="825" y="887" class="note">否</text>
<path d="M600 940V975" class="edge"/><text x="695" y="962" class="note">是，已完成获准修复</text>
<rect x="350" y="975" width="500" height="60" rx="14" class="box stage"/><text x="600" y="1001" class="label">aw-wording-reviewer</text><text x="600" y="1024" class="note">最后进行一致化文案收敛</text>
<path d="M600 1035V1065" class="edge"/>
<rect x="350" y="1065" width="500" height="65" rx="14" class="box done"/><text x="600" y="1092" class="label">交付当前版本与流程结果</text><text x="600" y="1116" class="note">入口、动态简报、报告与未解决事项</text>
<text x="600" y="1170" class="note">缺失依赖或未决条件如实记录；继续时从当前阶段接续</text>
</svg>