<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title id="title">AW Design Shaping · 设计塑形</title>
<desc id="desc">从需求、想法或竞品建立理解，确认探索方式，按需交替追问、研究与可视化，修正需求和方案。关键问题未解决则继续探索，用户确认方向后交付初版生成所需简报；暂停时保存探索进度。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52606d"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#203243;text-anchor:middle}.heading{font-size:30px;font-weight:700}.title{font-size:18px;font-weight:600}.note{font-size:14px}.box{stroke-width:2;rx:14}.input{fill:#fff;stroke:#9eacb8}.step{fill:#edf6ff;stroke:#287bbb}.done{fill:#edf9f1;stroke:#2e8b54}.pause{fill:#fff0ef;stroke:#c94b43}.line{fill:none;stroke:#52606d;stroke-width:2.5;marker-end:url(#arrow)}</style>
<rect width="1200" height="1200" fill="#f7f9fb"/>
<text x="600" y="48" class="heading">AW Design Shaping · 设计塑形</text>
<text x="600" y="78" class="note">让需求、想法和竞品参考成为双方认可的设计方向</text>
<rect x="370" y="108" width="460" height="65" rx="14" class="box input"/>
<text x="600" y="135" class="title">理解目标与已有材料</text><text x="600" y="157" class="note">PRD / 模糊想法 / 竞品 / 混合输入</text>
<path d="M600 173V205" class="line"/>
<rect x="370" y="205" width="460" height="70" rx="14" class="box step"/>
<text x="600" y="234" class="title">与用户确认探索方式</text><text x="600" y="257" class="note">沿用现有设计 / 自由探索；已有选择直接沿用</text>
<path d="M600 275V310" class="line"/>
<rect x="290" y="310" width="620" height="170" rx="14" class="box step"/>
<text x="600" y="342" class="title">围绕当前未决问题选择行动</text>
<rect x="315" y="365" width="170" height="65" rx="14" class="box input"/><text x="400" y="392" class="title">聚焦追问</text><text x="400" y="415" class="note">依赖关系与取舍</text>
<rect x="515" y="365" width="170" height="65" rx="14" class="box input"/><text x="600" y="392" class="title">竞品研究</text><text x="600" y="415" class="note">观察、解释与借鉴</text>
<rect x="715" y="365" width="170" height="65" rx="14" class="box input"/><text x="800" y="392" class="title">可视化探索</text><text x="800" y="415" class="note">线框图与低保真交互</text>
<text x="600" y="460" class="note">按需交替；关键取舍由用户决定，局部方案由 AI 提出</text>
<path d="M600 480V520" class="line"/>
<rect x="370" y="520" width="460" height="70" rx="14" class="box step"/>
<text x="600" y="549" class="title">修正需求与方案</text><text x="600" y="573" class="note">对照目标、比较方向，同步图稿与决定</text>
<path d="M600 590V625" class="line"/>
<path d="M600 625L785 695L600 765L415 695Z" fill="#fff7e6" stroke="#c98312" stroke-width="2"/>
<text x="600" y="690" class="title">足以生成初版且</text><text x="600" y="716" class="title">用户确认当前方向？</text>
<path d="M415 695H230V345H290" class="line"/><text x="290" y="680" class="note">否：继续探索</text>
<path d="M600 765V825" class="line"/><text x="625" y="800" class="note">是</text>
<rect x="370" y="825" width="460" height="78" rx="14" class="box done"/>
<text x="600" y="856" class="title">交付设计简报与必要图稿</text><text x="600" y="883" class="note">简报随已批准决定更新，标明实施状态与剩余问题</text>
<path d="M600 903V940" class="line"/>
<rect x="370" y="940" width="460" height="64" rx="14" class="box input"/>
<text x="600" y="968" class="title">组件库 + DESIGN.md → 生成初版</text><text x="600" y="990" class="note">后续阶段；状态覆盖另行展开</text>
<path d="M910 450H1010V520" class="line"/><text x="1025" y="435" class="note">用户暂停 / 无法继续</text>
<rect x="905" y="520" width="220" height="90" rx="14" class="box pause"/>
<text x="1015" y="551" class="title">保存探索进度</text><text x="1015" y="576" class="note">记录下一个决定</text><text x="1015" y="596" class="note">不标记为已确认方案</text>
</svg>