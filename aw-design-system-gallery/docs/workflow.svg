<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1320" role="img" aria-labelledby="title desc">
<title id="title">Design System Gallery 工作流程</title>
<desc id="desc">沿用完整会话授权并确定范围。证据不足时请求必要输入，缺少专门约定文档不阻塞。入口先区分其他页面与 Components；组件按页面结构、Playground、开发契约、Anatomy、Interactive Demo、Properties、Usage、Composition、Best Practices 九项渐进读取，Playground 进一步按属性、行为、内容分组。取证先审查源码，复用相关测试与已完成的运行证据；仅源码不足、疑似异常或需观察运行表现时使用浏览器最小路径复核，不默认逐组件完整巡检。占位按角色判断：通用 Text 与描述 Description 均允许，不扩大为任意业务文案。默认 Playground 单实例、Properties 每值单实例，多实例需必要组合或明确比较目的。外层容器默认省略 Anatomy，互斥状态形态合为稳定部位；组件行为真实运行，调用方效果默认无副作用承接。尺寸和加载检查不能替代这些语义判断。Anatomy 先按组件自身可视构成判断适用性，不把调用方内容或行为机制作为必需理由，Composition 依赖说明独立判断。新增或改名轴先做正式筛选与命名预检，依赖变化先识别三处关系，疑点或运行表现需确认时，浏览器最小路径复核。歧义或未授权写入仅阻塞受影响项。只读路径交付建议，实施路径按专题验收并修复重验，移除交互按真实移除与共享空预览恢复规则处理，恢复预览并报告未验证项。设计系统校验以组件名为首列、九项为后续列，问题 cell 使用全报告唯一编号及简述，表后按编号完整展开；通过、不适用与待验分别标记。其他页面单独列表。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52606d"/></marker>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;text-anchor:middle;fill:#1f2933}
.title{font-size:30px;font-weight:700}.node-title{font-size:18px;font-weight:600}.body{font-size:14px;fill:#52606d}.label{font-size:14px;font-weight:600;fill:#334e68}
.input{fill:#fff;stroke:#9eacb8}.stage{fill:#edf6ff;stroke:#287bbb}.decision{fill:#fff7e6;stroke:#c98312}.stop{fill:#fff0ef;stroke:#c94b43}.output{fill:#edf9f1;stroke:#2e8b54}
rect,polygon{stroke-width:2}.flow,.join{fill:none;stroke:#52606d;stroke-width:2.5}.flow{marker-end:url(#arrow)}
</style></defs><rect width="1200" height="1320" fill="#f7f9fb"/>
<text class="title" x="600" y="52">Design System Gallery 工作流程</text>
<path class="flow" d="M600 155V190"/>
<path class="flow" d="M780 250H890"/>
<path class="flow" d="M600 310V350"/>
<path class="flow" d="M600 430V470"/>
<path class="flow" d="M600 565V600"/>
<path class="flow" d="M780 660H890"/>
<path class="flow" d="M600 720V800"/>
<path class="join" d="M1030 710V760H600"/>
<path class="flow" d="M420 860H270V970"/>
<path class="flow" d="M780 860H930V970"/>
<path class="join" d="M270 1080V1150H600"/>
<path class="join" d="M930 1080V1150H600"/>
<path class="flow" d="M600 1150V1190"/>
<text class="body" x="832" y="235">不足</text>
<text class="body" x="629" y="335">足够</text>
<text class="body" x="839" y="645">有</text>
<text class="body" x="630" y="748">无</text>
<text class="body" x="818" y="747">独立项继续</text>
<text class="body" x="326" y="845">仅审查</text>
<text class="body" x="872" y="845">已授权实施</text>
<rect class="input" x="350" y="80" width="500" height="75" rx="14"/>
<text class="node-title" x="600.0" y="110">确定本次范围与执行模式</text>
<text class="body" x="600.0" y="135">沿用完整会话授权，局部或全量按请求处理</text>
<polygon class="decision" points="600,190 780,250 600,310 420,250"/>
<text class="node-title" x="600" y="246">目标与判断证据足够？</text>
<text class="body" x="600" y="270">缺少专门约定文档不等于缺少目标</text>
<rect class="stop" x="890" y="200" width="280" height="100" rx="14"/>
<text class="node-title" x="1030.0" y="230">请求必要输入</text>
<text class="body" x="1030.0" y="255">只补当前判断缺失的目标或证据</text>
<rect class="stage" x="330" y="350" width="540" height="80" rx="14"/>
<text class="node-title" x="600.0" y="380">按当前问题读取约定与证据</text>
<text class="body" x="600.0" y="405">先分页面类型；源码优先，复用已有测试与证据</text>
<rect class="stage" x="330" y="470" width="540" height="95" rx="14"/>
<text class="node-title" x="600.0" y="500">按所选专题作出判断</text>
<text class="body" x="600.0" y="525">九项核对实例、部位、事件与角色占位</text>
<text class="body" x="600.0" y="546">疑点或运行表现需确认时，浏览器最小路径复核</text>
<polygon class="decision" points="600,600 780,660 600,720 420,660"/>
<text class="node-title" x="600" y="656">存在歧义或范围阻塞？</text>
<text class="body" x="600" y="680">唯一映射直接记录；不擅改 API</text>
<rect class="stop" x="890" y="610" width="280" height="100" rx="14"/>
<text class="node-title" x="1030.0" y="640">仅暂停受影响项</text>
<text class="body" x="1030.0" y="665">说明具体选择或未授权写入</text>
<text class="body" x="1030.0" y="686">已有授权不重复询问</text>
<polygon class="decision" points="600,800 780,860 600,920 420,860"/>
<text class="node-title" x="600" y="856">本次是否实施修改？</text>
<text class="body" x="600" y="880">“移除、调整”按执行模式处理</text>
<rect class="stage" x="40" y="970" width="460" height="110" rx="14"/>
<text class="node-title" x="270.0" y="1000">核对证据并整理审查建议</text>
<text class="body" x="270.0" y="1025">保留文件与公开契约</text>
<text class="body" x="270.0" y="1046">建议说明位置、原因和可执行改法</text>
<rect class="stage" x="700" y="970" width="460" height="110" rx="14"/>
<text class="node-title" x="930.0" y="1000">实施修改、检查并修复</text>
<text class="body" x="930.0" y="1025">按专题验收；源码、测试不足时浏览器补验</text>
<text class="body" x="930.0" y="1046">观察实际结果；空预览复用容器 Restore</text>
<text class="body" x="930.0" y="1067">排序规则写回 Skill：提醒并获许可后同步</text>
<rect class="output" x="300" y="1190" width="600" height="85" rx="14"/>
<text class="node-title" x="600.0" y="1220">交付统一矩阵、编号问题与验证状态</text>
<text class="body" x="600.0" y="1245">校验按组件九项汇总并展开问题；明确待验与不适用</text>
</svg>
