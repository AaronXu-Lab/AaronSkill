<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Design token consistency audit workflow</title><desc id="desc">Select at least two token sources, normalize them, compare evidence, validate three audit artifacts, and report repair priorities without rewriting sources.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#52606d"/></marker><style>.h{font:700 30px -apple-system,BlinkMacSystemFont,sans-serif;fill:#17212b}.l{font:600 18px -apple-system,BlinkMacSystemFont,sans-serif;fill:#17212b;text-anchor:middle}.d{font:400 14px -apple-system,BlinkMacSystemFont,sans-serif;fill:#52606d;text-anchor:middle}.b{fill:#fff;stroke:#9eacb8;stroke-width:2}.x{fill:#edf6ff;stroke:#287bbb;stroke-width:2}.q{fill:#fff7e6;stroke:#c98312;stroke-width:2}.s{fill:#fff0ef;stroke:#c94b43;stroke-width:2}.g{fill:#edf9f1;stroke:#2e8b54;stroke-width:2}.p{fill:none;stroke:#52606d;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="900" fill="#f7f9fb"/><text class="h" x="600" y="48" text-anchor="middle">Design Token Consistency Audit</text>
  <polygon class="q" points="600,90 790,150 600,210 410,150"/><text class="l" x="600" y="146">At least two sources?</text><text class="d" x="600" y="170">Figma · DESIGN.md · CSS/Less</text>
  <path class="p" d="M790 150H850"/><rect class="s" x="850" y="115" width="300" height="70" rx="14"/><text class="l" x="1000" y="145">Stop for missing input</text><text class="d" x="1000" y="167">Require distinct source keys</text>
  <path class="p" d="M600 210V255"/><rect class="x" x="420" y="255" width="360" height="64" rx="14"/><text class="l" x="600" y="283">Load source evidence</text><text class="d" x="600" y="305">Preserve raw names and values</text>
  <path class="p" d="M600 319V365"/><rect class="x" x="420" y="365" width="360" height="64" rx="14"/><text class="l" x="600" y="393">Normalize and resolve aliases</text><text class="d" x="600" y="415">Names · units · colors · references</text>
  <path class="p" d="M600 429V475"/><rect class="x" x="420" y="475" width="360" height="64" rx="14"/><text class="l" x="600" y="503">Compare selected sources</text><text class="d" x="600" y="525">Coverage · mismatches · collisions</text>
  <path class="p" d="M600 539V585"/><rect class="x" x="420" y="585" width="360" height="64" rx="14"/><text class="l" x="600" y="613">Write three artifacts</text><text class="d" x="600" y="635">JSON · CSV · Markdown</text>
  <path class="p" d="M600 649V695"/><rect class="x" x="420" y="695" width="360" height="64" rx="14"/><text class="l" x="600" y="723">Validate schema and counts</text><text class="d" x="600" y="745">Keep selected-source status explicit</text>
  <path class="p" d="M600 759V800"/><rect class="g" x="450" y="800" width="300" height="60" rx="30"/><text class="l" x="600" y="836">Report repair priorities</text>
</svg>
