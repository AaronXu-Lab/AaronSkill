<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Figma component governance workflow</title><desc id="desc">Inspect a component set, decide variant and property boundaries, apply narrow edits, re-read definitions, then report manual value reordering and a structured audit.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#52606d"/></marker><style>.h{font:700 30px -apple-system,BlinkMacSystemFont,sans-serif;fill:#17212b}.l{font:600 18px -apple-system,BlinkMacSystemFont,sans-serif;fill:#17212b;text-anchor:middle}.d{font:400 14px -apple-system,BlinkMacSystemFont,sans-serif;fill:#52606d;text-anchor:middle}.b{fill:#fff;stroke:#9eacb8;stroke-width:2}.x{fill:#edf6ff;stroke:#287bbb;stroke-width:2}.q{fill:#fff7e6;stroke:#c98312;stroke-width:2}.g{fill:#edf9f1;stroke:#2e8b54;stroke-width:2}.p{fill:none;stroke:#52606d;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="900" fill="#f7f9fb"/><text class="h" x="600" y="48" text-anchor="middle">Figma Component Governance</text>
  <rect class="b" x="420" y="80" width="360" height="64" rx="14"/><text class="l" x="600" y="108">Inspect component set</text><text class="d" x="600" y="130">Names · variants · children · sizing</text><path class="p" d="M600 144V190"/>
  <polygon class="q" points="600,190 790,250 600,310 410,250"/><text class="l" x="600" y="246">Variant or Property?</text><text class="d" x="600" y="270">Structure · visibility · replacement · slot</text>
  <path class="p" d="M600 310V355"/><rect class="x" x="420" y="355" width="360" height="64" rx="14"/><text class="l" x="600" y="383">Plan semantic model</text><text class="d" x="600" y="405">Names and target order</text>
  <path class="p" d="M600 419V465"/><rect class="x" x="420" y="465" width="360" height="64" rx="14"/><text class="l" x="600" y="493">Apply narrow safe writes</text><text class="d" x="600" y="515">Stable node IDs · loaded fonts</text>
  <path class="p" d="M600 529V575"/><rect class="x" x="420" y="575" width="360" height="64" rx="14"/><text class="l" x="600" y="603">Re-read definitions</text><text class="d" x="600" y="625">Compare every variantOptions array</text>
  <path class="p" d="M600 639V680"/><polygon class="q" points="600,680 780,735 600,790 420,735"/><text class="l" x="600" y="731">Value order mismatch?</text><text class="d" x="600" y="754">Plugin API cannot reorder safely</text>
  <path class="p" d="M780 735H850"/><rect class="x" x="850" y="700" width="300" height="70" rx="14"/><text class="l" x="1000" y="730">Give manual instructions</text><text class="d" x="1000" y="752">Exact current and target arrays</text>
  <path class="p" d="M600 790V820"/><rect class="g" x="440" y="820" width="320" height="60" rx="30"/><text class="l" x="600" y="856">Attach structured JSON audit</text>
</svg>
