<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
  <title id="title">UI component find and port workflow</title><desc id="desc">Separate discovery from implementation, stop for explicit user selection, then verify the source and adapt the smallest compatible implementation.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#52606d"/></marker><style>.h{font:700 30px -apple-system,BlinkMacSystemFont,sans-serif;fill:#17212b}.l{font:600 18px -apple-system,BlinkMacSystemFont,sans-serif;fill:#17212b;text-anchor:middle}.d{font:400 14px -apple-system,BlinkMacSystemFont,sans-serif;fill:#52606d;text-anchor:middle}.b{fill:#fff;stroke:#9eacb8;stroke-width:2}.x{fill:#edf6ff;stroke:#287bbb;stroke-width:2}.q{fill:#fff7e6;stroke:#c98312;stroke-width:2}.s{fill:#fff0ef;stroke:#c94b43;stroke-width:2}.g{fill:#edf9f1;stroke:#2e8b54;stroke-width:2}.p{fill:none;stroke:#52606d;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="960" fill="#f7f9fb"/><text class="h" x="600" y="48" text-anchor="middle">Find and Port UI Component</text>
  <polygon class="q" points="600,80 790,140 600,200 410,140"/><text class="l" x="600" y="136">Which phase?</text><text class="d" x="600" y="160">Find or explicitly selected Port</text>
  <path class="p" d="M410 140H280V230"/><rect class="x" x="100" y="230" width="360" height="70" rx="14"/><text class="l" x="280" y="260">Refresh and search catalogs</text><text class="d" x="280" y="282">Behavior · source · license · compatibility</text>
  <path class="p" d="M280 300V350"/><rect class="x" x="100" y="350" width="360" height="70" rx="14"/><text class="l" x="280" y="380">Verify and compare candidates</text><text class="d" x="280" y="402">Account for every curated source</text>
  <path class="p" d="M280 420V470"/><rect class="s" x="100" y="470" width="360" height="70" rx="14"/><text class="l" x="280" y="500">Stop for user selection</text><text class="d" x="280" y="522">Find never edits the target project</text>
  <path class="p" d="M790 140H920V230"/><rect class="x" x="740" y="230" width="360" height="70" rx="14"/><text class="l" x="920" y="260">Revalidate exact source</text><text class="d" x="920" y="282">Imports · license · accessibility</text>
  <path class="p" d="M920 300V350"/><rect class="x" x="740" y="350" width="360" height="70" rx="14"/><text class="l" x="920" y="380">Inspect target contract</text><text class="d" x="920" y="402">Stack · tokens · existing components</text>
  <path class="p" d="M920 420V470"/><rect class="x" x="740" y="470" width="360" height="70" rx="14"/><text class="l" x="920" y="500">Implement minimum scope</text><text class="d" x="920" y="522">Reuse and adapt project conventions</text>
  <path class="p" d="M920 540V600H600V650"/><rect class="x" x="420" y="650" width="360" height="70" rx="14"/><text class="l" x="600" y="680">Validate proportionally</text><text class="d" x="600" y="702">Types · tests · UI · build boundaries</text>
  <path class="p" d="M600 720V780"/><rect class="g" x="440" y="780" width="320" height="64" rx="32"/><text class="l" x="600" y="818">Report port result</text>
</svg>
