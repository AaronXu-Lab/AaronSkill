<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1210" role="img" aria-labelledby="title desc">
  <title id="title">UI component find and port workflow</title><desc id="desc">Separate discovery from implementation, stop for explicit user selection, then verify the source, adapt the smallest compatible implementation, and repair affected checks before delivery or report a concrete blocker.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#52606d"/></marker><style>.h{font:700 30px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#17212b}.l{font:600 18px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#17212b;text-anchor:middle}.d{font:400 14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#52606d;text-anchor:middle}.b{fill:#fff;stroke:#9eacb8;stroke-width:2}.x{fill:#edf6ff;stroke:#287bbb;stroke-width:2}.q{fill:#fff7e6;stroke:#c98312;stroke-width:2}.s{fill:#fff0ef;stroke:#c94b43;stroke-width:2}.g{fill:#edf9f1;stroke:#2e8b54;stroke-width:2}.p{fill:none;stroke:#52606d;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="1210" fill="#f7f9fb"/><text class="h" x="600" y="48" text-anchor="middle">Find and Port UI Component</text>
  <polygon class="q" points="600,80 790,140 600,200 410,140"/><text class="l" x="600" y="136">Which phase?</text><text class="d" x="600" y="160">Intent + existing user selection</text>
  <path class="p" d="M410 140H280V230"/><text class="d" x="325" y="130">Find</text><rect class="x" x="100" y="230" width="360" height="70" rx="14"/><text class="l" x="280" y="260">Refresh once, then search</text><text class="d" x="280" y="282">One Find run · shared catalog snapshot</text>
  <path class="p" d="M280 300V350"/><rect class="x" x="100" y="350" width="360" height="70" rx="14"/><text class="l" x="280" y="380">Verify and compare candidates</text><text class="d" x="280" y="402">Check behavior, exact source and all six sources</text>
  <path class="p" d="M280 420V470"/><rect class="s" x="100" y="470" width="360" height="70" rx="14"/><text class="l" x="280" y="500">Stop for user selection</text><text class="d" x="280" y="522">Find never edits the target project</text>
  <path class="p" d="M790 140H920V230"/><text class="d" x="875" y="130">Port</text><rect class="x" x="740" y="230" width="360" height="70" rx="14"/><text class="l" x="920" y="260">Revalidate exact source</text><text class="d" x="920" y="282">Imports · license · accessibility</text>
  <path class="p" d="M920 300V350"/><rect class="x" x="740" y="350" width="360" height="70" rx="14"/><text class="l" x="920" y="380">Inspect target contract</text><text class="d" x="920" y="402">Stack · tokens · existing components</text>
  <path class="p" d="M920 420V455"/>
  <polygon class="q" points="920,455 1100,515 920,575 740,515"/><text class="l" x="920" y="511">Ready to implement?</text><text class="d" x="920" y="535">Evidence + existing approvals</text>
  <path class="p" d="M740 515H660V600H470"/><text class="d" x="680" y="503">Missing</text>
  <rect class="s" x="100" y="565" width="370" height="70" rx="14"/><text class="l" x="285" y="595">Report gap or unresolved choice</text><text class="d" x="285" y="617">Keep prior approvals; prepare a concrete proposal</text>
  <path class="p" d="M920 575V640"/><text class="d" x="958" y="610">Ready</text>
  <rect class="x" x="740" y="640" width="360" height="70" rx="14"/><text class="l" x="920" y="670">Implement minimum scope</text><text class="d" x="920" y="692">Reuse and adapt project conventions</text>
  <path class="p" d="M920 710V750H600V800"/><rect class="x" x="420" y="800" width="360" height="70" rx="14"/><text class="l" x="600" y="830">Validate proportionally</text><text class="d" x="600" y="852">Types · tests · UI · build boundaries</text>
  <path class="p" d="M600 870V910"/>
  <polygon class="q" points="600,910 780,975 600,1040 420,975"/><text class="l" x="600" y="971">Validation outcome?</text><text class="d" x="600" y="995">Checks required for this change</text>
  <path class="p" d="M420 975H360"/><text class="d" x="388" y="950">Fixable</text>
  <rect class="x" x="60" y="940" width="300" height="70" rx="14"/><text class="l" x="210" y="970">Repair within approved scope</text><text class="d" x="210" y="992">Rerun affected checks</text>
  <path class="p" d="M210 940V835H420"/>
  <path class="p" d="M780 975H860"/><text class="d" x="820" y="950">Blocked</text>
  <rect class="s" x="860" y="940" width="300" height="70" rx="14"/><text class="l" x="1010" y="970">Report partial result</text><text class="d" x="1010" y="992">Evidence gap · environment · scope</text>
  <path class="p" d="M600 1040V1110"/><text class="d" x="644" y="1074">Passed</text>
  <rect class="g" x="440" y="1110" width="320" height="64" rx="14"/><text class="l" x="600" y="1148">Deliver verified port</text>
</svg>
