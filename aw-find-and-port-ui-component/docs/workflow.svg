<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1380" role="img" aria-labelledby="title desc">
  <title id="title">UI component find and port workflow</title><desc id="desc">First confirm that the primary intent and unit of work concern one concrete UI component. Route broader app, page, workspace, or file migration to the ordinary project workflow. Then separate discovery from implementation, stop for explicit user selection, verify the exact component source, adapt the smallest compatible implementation, and validate before delivery.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#52606d"/></marker><style>.h{font:700 30px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#17212b}.l{font:600 18px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#17212b;text-anchor:middle}.d{font:400 14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#52606d;text-anchor:middle}.b{fill:#fff;stroke:#9eacb8;stroke-width:2}.x{fill:#edf6ff;stroke:#287bbb;stroke-width:2}.q{fill:#fff7e6;stroke:#c98312;stroke-width:2}.s{fill:#fff0ef;stroke:#c94b43;stroke-width:2}.g{fill:#edf9f1;stroke:#2e8b54;stroke-width:2}.p{fill:none;stroke:#52606d;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="1380" fill="#f7f9fb"/><text class="h" x="600" y="48" text-anchor="middle">Find and Port UI Component</text>
  <polygon class="q" points="600,80 790,140 600,200 410,140"/><text class="l" x="600" y="136">Component-level task?</text><text class="d" x="600" y="160">Primary intent + unit of work</text>
  <path class="p" d="M790 140H830"/><text class="d" x="810" y="126">No</text><rect class="b" x="830" y="105" width="330" height="70" rx="14"/><text class="l" x="995" y="135">Use ordinary project workflow</text><text class="d" x="995" y="157">App · page · workspace · file migration</text>
  <path class="p" d="M600 200V250"/><text class="d" x="624" y="228">Yes</text>
  <polygon class="q" points="600,250 790,310 600,370 410,310"/><text class="l" x="600" y="306">Which phase?</text><text class="d" x="600" y="330">Discovery intent + existing selection</text>
  <path class="p" d="M410 310H280V410"/><text class="d" x="325" y="300">Find</text><rect class="x" x="100" y="410" width="360" height="70" rx="14"/><text class="l" x="280" y="440">Refresh once, then search</text><text class="d" x="280" y="462">One Find run · shared catalog snapshot</text>
  <path class="p" d="M280 480V530"/><rect class="x" x="100" y="530" width="360" height="70" rx="14"/><text class="l" x="280" y="560">Verify and compare candidates</text><text class="d" x="280" y="582">Behavior · exact source · compatibility</text>
  <path class="p" d="M280 600V650"/><rect class="s" x="100" y="650" width="360" height="70" rx="14"/><text class="l" x="280" y="680">Stop for user selection</text><text class="d" x="280" y="702">Find never edits the target project</text>
  <path class="p" d="M790 310H920V410"/><text class="d" x="875" y="300">Port</text><rect class="x" x="740" y="410" width="360" height="70" rx="14"/><text class="l" x="920" y="440">Revalidate exact component source</text><text class="d" x="920" y="462">Imports · license · accessibility</text>
  <path class="p" d="M920 480V530"/><rect class="x" x="740" y="530" width="360" height="70" rx="14"/><text class="l" x="920" y="560">Inspect target contract</text><text class="d" x="920" y="582">Stack · tokens · existing components</text>
  <path class="p" d="M920 600V635"/>
  <polygon class="q" points="920,635 1100,695 920,755 740,695"/><text class="l" x="920" y="691">Ready to implement?</text><text class="d" x="920" y="715">Evidence + existing approvals</text>
  <path class="p" d="M740 695H660V780H470"/><text class="d" x="680" y="683">Missing</text>
  <rect class="s" x="100" y="745" width="370" height="70" rx="14"/><text class="l" x="285" y="775">Report gap or unresolved choice</text><text class="d" x="285" y="797">Keep prior approvals; prepare a concrete proposal</text>
  <path class="p" d="M920 755V820"/><text class="d" x="958" y="790">Ready</text>
  <rect class="x" x="740" y="820" width="360" height="70" rx="14"/><text class="l" x="920" y="850">Implement minimum scope</text><text class="d" x="920" y="872">Reuse and adapt project conventions</text>
  <path class="p" d="M920 890V930H600V970"/><rect class="x" x="420" y="970" width="360" height="70" rx="14"/><text class="l" x="600" y="1000">Validate proportionally</text><text class="d" x="600" y="1022">Types · tests · UI · build boundaries</text>
  <path class="p" d="M600 1040V1080"/>
  <polygon class="q" points="600,1080 780,1145 600,1210 420,1145"/><text class="l" x="600" y="1141">Validation outcome?</text><text class="d" x="600" y="1165">Checks required for this change</text>
  <path class="p" d="M420 1145H360"/><text class="d" x="388" y="1120">Fixable</text>
  <rect class="x" x="60" y="1110" width="300" height="70" rx="14"/><text class="l" x="210" y="1140">Repair within approved scope</text><text class="d" x="210" y="1162">Rerun affected checks</text>
  <path class="p" d="M210 1110V1005H420"/>
  <path class="p" d="M780 1145H860"/><text class="d" x="820" y="1120">Blocked</text>
  <rect class="s" x="860" y="1110" width="300" height="70" rx="14"/><text class="l" x="1010" y="1140">Report partial result</text><text class="d" x="1010" y="1162">Evidence gap · environment · scope</text>
  <path class="p" d="M600 1210V1270"/><text class="d" x="644" y="1244">Passed</text>
  <rect class="g" x="440" y="1270" width="320" height="64" rx="14"/><text class="l" x="600" y="1308">Deliver verified port</text>
</svg>
