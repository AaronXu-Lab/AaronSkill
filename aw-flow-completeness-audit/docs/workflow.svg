<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1160" viewBox="0 0 1200 1160" role="img" aria-labelledby="title desc">
  <title id="title">流程完整性审查</title>
  <desc id="desc">限定目标和证据，追踪入口、分支、交接与结果，按适用条件审查并分类发现。交付报告后强制人工 Review；未审阅或未授权时停留在报告阶段，审阅并授权后才实施及复查。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #203344; text-anchor: middle; }
    .title { font-size: 30px; font-weight: 700; }
    .heading { font-size: 18px; font-weight: 600; }
    .note { font-size: 14px; font-weight: 400; }
    .input { fill: #ffffff; stroke: #9eacb8; stroke-width: 2; }
    .step { fill: #edf6ff; stroke: #287bbb; stroke-width: 2; }
    .decision { fill: #fff7e6; stroke: #c98312; stroke-width: 2; }
    .stop { fill: #fff0ef; stroke: #c94b43; stroke-width: 2; }
    .output { fill: #edf9f1; stroke: #2e8b54; stroke-width: 2; }
    .edge { fill: none; stroke: #52606d; stroke-width: 2.5; marker-end: url(#arrow); }
  </style>
  <rect width="1200" height="1160" fill="#f7f9fb"/>
  <text class="title" x="600" y="48">流程完整性审查</text>
  <text class="note" x="600" y="78">从实际入口追踪到任务结果 · 先审计，人工 Review 后再实施</text>

  <rect class="input" x="380" y="110" width="440" height="72" rx="14"/>
  <text class="heading" x="600" y="139">限定任务、范围与证据</text>
  <text class="note" x="600" y="162">已实现界面优先，注明原型与描述的验证限制</text>
  <path class="edge" d="M600 182 V220"/>

  <rect class="step" x="380" y="220" width="440" height="72" rx="14"/>
  <text class="heading" x="600" y="249">追踪步骤、分支与角色交接</text>
  <text class="note" x="600" y="272">范围外记录依赖，终点对应真实任务结果</text>
  <path class="edge" d="M600 292 V330"/>

  <rect class="step" x="380" y="330" width="440" height="72" rx="14"/>
  <text class="heading" x="600" y="359">检查适用转换、中断与恢复</text>
  <text class="note" x="600" y="382">正常路径在先，再核对条件、上下文与副作用</text>
  <path class="edge" d="M600 402 V440"/>

  <rect class="step" x="380" y="440" width="440" height="72" rx="14"/>
  <text class="heading" x="600" y="469">分类发现，提出最小补全建议</text>
  <text class="note" x="600" y="492">区分已验证缺口、待决产品规则与待验证项</text>
  <path class="edge" d="M600 512 V550"/>

  <rect class="output" x="380" y="550" width="440" height="72" rx="14"/>
  <text class="heading" x="600" y="579">交付审计报告与续接记录</text>
  <text class="note" x="600" y="602">仅审查的请求在此完成；完整性结论受证据限制</text>
  <path class="edge" d="M600 622 V670"/>

  <polygon class="decision" points="600,670 780,745 600,820 420,745"/>
  <text class="heading" x="600" y="739">人工已 Review</text>
  <text class="heading" x="600" y="762">并明确授权实施？</text>
  <path class="edge" d="M780 745 H900"/>
  <text class="note" x="842" y="731">否</text>
  <rect class="stop" x="900" y="708" width="260" height="74" rx="14"/>
  <text class="heading" x="1030" y="738">停在报告阶段</text>
  <text class="note" x="1030" y="761">初始修复请求不能越过此关口</text>
  <path class="edge" d="M600 820 V865"/>
  <text class="note" x="622" y="847">是</text>

  <rect class="step" x="380" y="865" width="440" height="72" rx="14"/>
  <text class="heading" x="600" y="894">按已确认范围实施与复查</text>
  <text class="note" x="600" y="917">新增产品取舍另交 Review，独立的已批事项继续</text>
  <path class="edge" d="M600 937 V980"/>

  <rect class="output" x="380" y="980" width="440" height="82" rx="14"/>
  <text class="heading" x="600" y="1012">更新处理结果与设计依据</text>
  <text class="note" x="600" y="1037">同步受影响简报，区分已批准、已实施与待验证</text>
  <text class="note" x="600" y="1120">分批审计保留稳定 ID、证据基线、未检查队列及 Review 状态</text>
</svg>
