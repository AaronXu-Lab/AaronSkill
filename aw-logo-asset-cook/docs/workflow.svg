<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1520" viewBox="0 0 1200 1520" role="img" aria-labelledby="title desc">
<title id="title">应用图标资源组与平台生成</title><desc id="desc">明确输入范围，图片评估重绘，映射已有 SVG 角色；缺项分别取得留白与补色授权，按场景保持构图一致。基础整理不依赖 Apple 工具；平台生成按范围预检，临时验证后替换受管文件，失败不触碰目标。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52606d"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#17212b;text-anchor:middle}.title{font-size:30px;font-weight:700}.label{font-size:18px;font-weight:600}.detail{font-size:14px;fill:#52606d}.line{fill:none;stroke:#52606d;stroke-width:2.5;marker-end:url(#arrow)}.input{fill:#fff;stroke:#9eacb8}.action{fill:#edf6ff;stroke:#287bbb}.decision{fill:#fff7e6;stroke:#c98312}.stop{fill:#fff0ef;stroke:#c94b43}.done{fill:#edf9f1;stroke:#2e8b54}rect,polygon{stroke-width:2}</style>
<rect width="1200" height="1520" fill="#f7f9fb"/>
<text class="title" x="600" y="46">应用图标资源组与平台生成</text>
<text class="detail" x="600" y="74">先保留已有组合，只处理已授权缺项；验证通过后才替换</text>
<rect class="input" x="420" y="100" width="360" height="70" rx="14"/><text class="label" x="600.0" y="129">明确指定源文件或目录</text>
<text class="detail" x="600.0" y="153">保留原始源；不递归猜测</text>
<path class="line" d="M600 170V210"/>
<text class="detail" x="670" y="195">SVG / 资源组</text>
<rect class="action" x="830" y="100" width="340" height="80" rx="14"/><text class="label" x="1000.0" y="129">图片评估与迭代重绘</text>
<a href="workflow.image.svg"><text class="detail" x="1000" y="153">workflow.image.svg</text></a>
<path class="line" d="M780 135H830"/>
<text class="detail" x="804" y="121">图片</text>
<path class="line" d="M1000 180V245H780"/>
<text class="detail" x="985" y="223">通过兼容性检查</text>
<rect class="action" x="420" y="210" width="360" height="70" rx="14"/><text class="label" x="600.0" y="239">映射留白、主题与底板角色</text>
<text class="detail" x="600.0" y="263">盘点已有组合与缺项</text>
<path class="line" d="M420 245H350"/>
<rect class="stop" x="30" y="210" width="320" height="70" rx="14"/><text class="label" x="190.0" y="239">角色不明确时询问</text>
<text class="detail" x="190.0" y="263">多文件不再要求唯一源</text>
<path class="line" d="M600 280V320"/>
<polygon class="decision" points="600,320 790,380 600,440 410,380"/><text class="label" x="600" y="375">缺项生成已分别授权？</text><text class="detail" x="600" y="400">留白整体变换 / 单主题补色</text>
<path class="line" d="M790 380H840"/>
<text class="detail" x="813" y="365">未授权</text>
<rect class="stop" x="840" y="345" width="330" height="80" rx="14"/><text class="label" x="1005.0" y="374">暂停对应生成</text>
<text class="detail" x="1005.0" y="398">不清理；可交付已有基础组合</text>
<path class="line" d="M600 440V480"/>
<text class="detail" x="690" y="465">已授权 / 无需补齐</text>
<rect class="action" x="420" y="480" width="360" height="70" rx="14"/><text class="label" x="600.0" y="509">保留已有组合，派生缺项</text>
<text class="detail" x="600.0" y="533">确认独立底板；未知特性明确报错</text>
<path class="line" d="M600 550V590"/>
<rect class="action" x="420" y="590" width="360" height="70" rx="14"/><text class="label" x="600.0" y="619">按使用场景固定构图</text>
<text class="detail" x="600.0" y="643">全尺寸、ICO/ICNS、1×/2× 一致</text>
<path class="line" d="M600 660V700"/>
<polygon class="decision" points="600,700 790,760 600,820 410,760"/><text class="label" x="600" y="755">本次生成平台图标？</text><text class="detail" x="600" y="780">基础整理无需 Apple 依赖</text>
<path class="line" d="M790 760H840"/>
<text class="detail" x="810" y="745">是</text>
<rect class="action" x="840" y="725" width="330" height="80" rx="14"/><text class="label" x="1005.0" y="754">按范围检查平台依赖</text>
<text class="detail" x="1005.0" y="778">生成 .icon 才检查 compose-app-icon</text>
<path class="line" d="M1005 805V865"/><text class="detail" x="1030" y="845">缺失</text>
<rect class="stop" x="840" y="865" width="330" height="70" rx="14"/><text class="label" x="1005.0" y="894">缺依赖先报告受影响范围</text>
<text class="detail" x="1005.0" y="918">安装需授权；不触碰目标</text>
<path class="line" d="M840 780H810V995H780"/>
<text class="detail" x="884" y="842">依赖齐全</text>
<path class="line" d="M600 820V960"/>
<text class="detail" x="635" y="895">仅基础</text>
<rect class="action" x="420" y="960" width="360" height="70" rx="14"/><text class="label" x="600.0" y="989">临时生成资源与使用说明</text>
<text class="detail" x="600.0" y="1013">base / adaptive / 选择器 / 所选平台</text>
<path class="line" d="M600 1030V1070"/>
<rect class="action" x="420" y="1070" width="360" height="70" rx="14"/><text class="label" x="600.0" y="1099">实际渲染与范围内校验</text>
<text class="detail" x="600.0" y="1123">主题像素 / 安全圆 / Apple 双格式</text>
<path class="line" d="M600 1140V1180"/>
<polygon class="decision" points="600,1180 790,1240 600,1300 410,1240"/><text class="label" x="600" y="1235">必要检查通过？</text><text class="detail" x="600" y="1260">未运行的引擎 / 集成检查明确报告</text>
<path class="line" d="M410 1240H350"/>
<text class="detail" x="380" y="1225">否</text>
<rect class="stop" x="30" y="1205" width="320" height="70" rx="14"/><text class="label" x="190.0" y="1234">修复或报告具体阻塞</text>
<text class="detail" x="190.0" y="1258">不发布，不删除已有文件</text>
<path class="line" d="M600 1300V1340"/>
<text class="detail" x="623" y="1327">是</text>
<rect class="done" x="420" y="1340" width="360" height="70" rx="14"/><text class="label" x="600.0" y="1369">替换受管文件并交付</text>
<text class="detail" x="600.0" y="1393">保护源、未接管 base 和无关文件</text>
</svg>
