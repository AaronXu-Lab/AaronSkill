<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1320" viewBox="0 0 1200 1320" role="img" aria-labelledby="title desc">
  <title id="title">应用图标资源生成核心流程</title>
  <desc id="desc">从用户显式指定 SVG 或图标资源目录并唯一解析源 SVG、只读主题检查和单主题 AI 补色授权，到依赖预检、包含不透明 Apple Touch、显式保留 Alpha 通道的 32-bit RGBA Play Store 提交图、最小 PWA manifest 和根目录分平台用法 README 的全平台生成及 Apple app.icon 明暗主题与传统 app.icns 解包验证的流程图。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#52606d"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #17212b; }
      .subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #687583; }
      .label { font: 600 18px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #17212b; text-anchor: middle; }
      .detail { font: 400 14px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #52606d; text-anchor: middle; }
      .branch { font: 700 14px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #52606d; }
      .line { fill: none; stroke: #52606d; stroke-width: 2.5; marker-end: url(#arrow); }
      .step { fill: #ffffff; stroke: #b7c2cc; stroke-width: 2; }
      .decision { fill: #fff8e8; stroke: #d89b26; stroke-width: 2.5; }
      .action { fill: #edf6ff; stroke: #3282c8; stroke-width: 2; }
      .stop { fill: #fff1f0; stroke: #cf554b; stroke-width: 2; }
      .done { fill: #edf9f1; stroke: #31945a; stroke-width: 2.5; }
    </style>
  </defs>

  <rect width="1200" height="1320" fill="#f7f9fb"/>
  <text class="title" x="600" y="46" text-anchor="middle">应用图标资源生成核心流程</text>
  <text class="subtitle" x="600" y="72" text-anchor="middle">主题授权、依赖检查和复检全部发生在清理或生成之前</text>

  <rect class="step" x="420" y="100" width="360" height="68" rx="16"/>
  <text class="label" x="600" y="129">用户指定 SVG 或图标资源目录</text>
  <text class="detail" x="600" y="153">必须是明确的绝对路径与资源范围</text>

  <path class="line" d="M600 168 V205"/>
  <polygon class="decision" points="600,205 790,265 600,325 410,265"/>
  <text class="label" x="600" y="261">能唯一解析到 SVG？</text>
  <text class="detail" x="600" y="285">文件本身，或目录根层唯一 *.svg</text>

  <path class="line" d="M410 265 H335"/>
  <rect class="stop" x="35" y="228" width="300" height="74" rx="16"/>
  <text class="label" x="185" y="258">停止并请用户指定</text>
  <text class="detail" x="185" y="282">无 SVG 或多个候选；不递归猜测</text>

  <path class="line" d="M600 325 V365"/>
  <rect class="action" x="420" y="365" width="360" height="70" rx="16"/>
  <text class="label" x="600" y="395">只读检查明暗主题</text>
  <text class="detail" x="600" y="419">dual · single-light · single-dark</text>

  <path class="line" d="M600 435 V475"/>
  <polygon class="decision" points="600,475 790,535 600,595 410,535"/>
  <text class="label" x="600" y="531">已包含可区分明暗色？</text>
  <text class="detail" x="600" y="555">完整保留现有主题行为</text>

  <text class="branch" x="805" y="521">否</text>
  <path class="line" d="M790 535 H850"/>
  <rect class="stop" x="850" y="495" width="310" height="80" rx="16"/>
  <text class="label" x="1005" y="527">提示缺失主题并询问</text>
  <text class="detail" x="1005" y="551">是否允许 AI 补充互补主题色？</text>

  <path class="line" d="M1005 575 V615"/>
  <polygon class="decision" points="1005,615 1145,665 1005,715 865,665"/>
  <text class="label" x="1005" y="661">用户明确允许？</text>
  <text class="detail" x="1005" y="684">未授权不得补色</text>

  <path class="line" d="M865 665 H810"/>
  <rect class="stop" x="535" y="630" width="275" height="70" rx="16"/>
  <text class="label" x="672" y="659">停止，不做任何生成</text>
  <text class="detail" x="672" y="682">不修改 SVG，不清理现有产物</text>

  <path class="line" d="M1005 715 V755"/>
  <rect class="action" x="825" y="755" width="360" height="82" rx="16"/>
  <text class="label" x="1005" y="786">AI 创建临时双主题 SVG</text>
  <text class="detail" x="1005" y="810">保留原主题与几何，只补缺失主题</text>

  <path class="line" d="M825 796 H790 V865 H780"/>
  <rect class="action" x="420" y="830" width="360" height="70" rx="16"/>
  <text class="label" x="600" y="860">渲染明暗外观并复检</text>
  <text class="detail" x="600" y="884">复检仍非 dual 则停止</text>

  <text class="branch" x="616" y="619">是</text>
  <path class="line" d="M600 595 V610 H385 V865 H420"/>

  <path class="line" d="M600 900 V940"/>
  <polygon class="decision" points="600,940 790,1000 600,1060 410,1000"/>
  <text class="label" x="600" y="996">compose-app-icon 完整？</text>
  <text class="detail" x="600" y="1020">文件、uv 与关联 SKILL 预检</text>

  <path class="line" d="M410 1000 H350"/>
  <rect class="stop" x="40" y="960" width="310" height="80" rx="16"/>
  <text class="label" x="195" y="992">停止并请求安装许可</text>
  <text class="detail" x="195" y="1016">获准安装后重新完整预检</text>

  <path class="line" d="M600 1060 V1095"/>
  <rect class="action" x="420" y="1095" width="360" height="72" rx="16"/>
  <text class="label" x="600" y="1125">重建最小平台资源</text>
  <text class="detail" x="600" y="1149">全平台资源 · PWA manifest · 用法 README</text>

  <path class="line" d="M600 1167 V1200"/>
  <rect class="action" x="420" y="1200" width="360" height="72" rx="16"/>
  <text class="label" x="600" y="1230">验证 Apple 双格式图标</text>
  <text class="detail" x="600" y="1254">.icon 外观验证 · .icns 尺寸与像素复检</text>

  <path class="line" d="M600 1272 V1287"/>
  <rect class="done" x="470" y="1287" width="260" height="30" rx="15"/>
  <text class="label" x="600" y="1310">完成并报告</text>
</svg>
