<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
  <title id="title">Brand logo discovery and export workflow</title><desc id="desc">Search seven source groups, inspect authentic assets, compare candidates, wait for explicit selection and dimensions, then export and verify a lossless WebP.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#52606d"/></marker><style>.h{font:700 30px -apple-system,BlinkMacSystemFont,sans-serif;fill:#17212b}.l{font:600 18px -apple-system,BlinkMacSystemFont,sans-serif;fill:#17212b;text-anchor:middle}.d{font:400 14px -apple-system,BlinkMacSystemFont,sans-serif;fill:#52606d;text-anchor:middle}.b{fill:#fff;stroke:#9eacb8;stroke-width:2}.x{fill:#edf6ff;stroke:#287bbb;stroke-width:2}.q{fill:#fff7e6;stroke:#c98312;stroke-width:2}.s{fill:#fff0ef;stroke:#c94b43;stroke-width:2}.g{fill:#edf9f1;stroke:#2e8b54;stroke-width:2}.p{fill:none;stroke:#52606d;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="920" fill="#f7f9fb"/><text class="h" x="600" y="48" text-anchor="middle">AW Logo Finder</text>
  <rect class="b" x="420" y="80" width="360" height="64" rx="14"/><text class="l" x="600" y="108">Resolve brand identity</text><text class="d" x="600" y="130">Company · product · current mark</text><path class="p" d="M600 144V190"/>
  <rect class="x" x="420" y="190" width="360" height="70" rx="14"/><text class="l" x="600" y="220">Search all seven sources</text><text class="d" x="600" y="244">Official · 3 logo sites · 3 app stores</text>
  <path class="p" d="M600 260V310"/><rect class="x" x="420" y="310" width="360" height="70" rx="14"/><text class="l" x="600" y="340">Inspect original assets</text><text class="d" x="600" y="364">Identity · size · ratio · watermark</text>
  <path class="p" d="M600 380V430"/><rect class="x" x="420" y="430" width="360" height="70" rx="14"/><text class="l" x="600" y="460">Compare and recommend</text><text class="d" x="600" y="484">Account for every source</text>
  <path class="p" d="M600 500V545"/><polygon class="q" points="600,545 790,605 600,665 410,605"/><text class="l" x="600" y="601">Candidate and size confirmed?</text><text class="d" x="600" y="625">Explicit user gate</text>
  <path class="p" d="M790 605H850"/><rect class="s" x="850" y="570" width="300" height="70" rx="14"/><text class="l" x="1000" y="600">Wait for confirmation</text><text class="d" x="1000" y="622">Do not convert or resize</text>
  <path class="p" d="M600 665V710"/><rect class="x" x="420" y="710" width="360" height="70" rx="14"/><text class="l" x="600" y="740">Prepare lossless WebP</text><text class="d" x="600" y="764">Preserve ratio and transparency</text>
  <path class="p" d="M600 780V825"/><rect class="g" x="440" y="825" width="320" height="64" rx="32"/><text class="l" x="600" y="863">Verify and deliver asset</text>
</svg>
