version: "1"
defaults:
  agent: codex
  provider: local
  trials: 5
  timeout: 300
  threshold: 0.8
  docker:
    base: node:20-slim
    setup: apt-get update && apt-get install -y --no-install-recommends ca-certificates && rm -rf /var/lib/apt/lists/*
tasks:
  - name: extract-diary-section
    instruction: |
      Use the aw-markdown-to-feishu skill to extract the section headed "Skill 管理" from diary.md into extracted.md and promote headings by one level. The output must stop before the next peer section. Do not connect to Feishu.
    workspace:
      - {src: fixtures/diary.md, dest: diary.md}
      - {src: fixtures/extract-grader.json, dest: grader-spec.json}
    graders:
      - {type: deterministic, run: graders/check-required.sh, weight: 0.7}
      - {type: llm_rubric, weight: 0.3, rubric: "Score exact section boundaries, heading promotion, preservation of list content, and absence of unrelated sections."}
  - name: explain-prerequisite-recovery
    instruction: |
      Use the aw-markdown-to-feishu skill to analyze errors.txt and write recovery.md. Explain the prerequisite, user-identity flag, keychain recovery, authentication boundary, and when execution must stop for user action. Do not install tools or publish anything.
    workspace:
      - {src: fixtures/errors.txt, dest: errors.txt}
      - {src: fixtures/recovery-grader.json, dest: grader-spec.json}
    graders:
      - {type: deterministic, run: graders/check-required.sh, weight: 0.7}
      - {type: llm_rubric, weight: 0.3, rubric: "Score accurate lark-cli recovery, secure credential handling, and clear pause/resume boundaries."}
  - name: plan-safe-image-publishing
    instruction: |
      Use the aw-markdown-to-feishu skill to read article.md and write image-workflow.md describing the reliable local-image publishing workflow. Include secure GitHub upload, anchors, media insertion, validation, and anchor cleanup. Do not upload, authenticate, or modify article.md.
    workspace:
      - {src: fixtures/article.md, dest: article.md}
      - {src: fixtures/image-grader.json, dest: grader-spec.json}
    graders:
      - {type: deterministic, run: graders/check-required.sh, weight: 0.7}
      - {type: llm_rubric, weight: 0.3, rubric: "Score completeness of the reliable media workflow, token safety, no destructive trash behavior, and final validation of image count and anchor removal."}
