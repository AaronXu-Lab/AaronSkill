<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
  <title id="title">AW Meta Skill 工作流程</title>
  <desc id="desc">理解 Skill 目标，遵循基础规范，创建或聚焦更新 Skill，分别为 AI 编写可含 Mermaid 的精确 Markdown 工作流、为人类提炼保留关键结构的 SVG 概览，最后校验并交付。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#52606d"/>
    </marker>
    <style>
      .canvas { fill: #f7f9fb; }
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #1f2933; }
      .subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #60717f; }
      .label { font: 600 18px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #1f2933; text-anchor: middle; }
      .detail { font: 400 14px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #52606d; text-anchor: middle; }
      .audience { font: 600 13px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; text-anchor: middle; }
      .link { fill: none; stroke: #52606d; stroke-width: 2.5; marker-end: url(#arrow); }
      .input { fill: #ffffff; stroke: #9eacb8; stroke-width: 2; }
      .step { fill: #edf6ff; stroke: #287bbb; stroke-width: 2; }
      .md { fill: #eef3ff; stroke: #536fbd; stroke-width: 2; }
      .svg { fill: #fff7e6; stroke: #c98312; stroke-width: 2; }
      .done { fill: #edf9f1; stroke: #2e8b54; stroke-width: 2; }
    </style>
  </defs>

  <rect class="canvas" width="1200" height="1040"/>
  <text class="title" x="600" y="54" text-anchor="middle">AW Meta Skill</text>
  <text class="subtitle" x="600" y="82" text-anchor="middle">同一工作流，两种载体，两种合适的复杂度</text>

  <path class="link" d="M600 190 V230"/>
  <path class="link" d="M600 330 V370"/>
  <path class="link" d="M600 470 V510"/>
  <path class="link" d="M600 630 V670"/>
  <path class="link" d="M600 790 V830"/>

  <rect class="input" x="350" y="110" width="500" height="80" rx="14"/>
  <text class="label" x="600" y="143">理解目标与范围</text>
  <text class="detail" x="600" y="168">明确 Skill 要解决的问题与交付边界</text>

  <rect class="step" x="350" y="230" width="500" height="100" rx="14"/>
  <text class="label" x="600" y="267">读取 skill-creator</text>
  <text class="detail" x="600" y="294">以基础规范约束结构、描述与资源选择</text>

  <rect class="step" x="350" y="370" width="500" height="100" rx="14"/>
  <text class="label" x="600" y="407">创建或聚焦更新 Skill</text>
  <text class="detail" x="600" y="434">维护必要资源、metadata 与版本</text>

  <rect class="md" x="290" y="510" width="620" height="120" rx="16"/>
  <text class="audience" x="600" y="541" fill="#536fbd">给 AI 执行</text>
  <text class="label" x="600" y="574">先写精确的 workflow.md</text>
  <text class="detail" x="600" y="601">正文定义规则，复杂结构可用 Mermaid 完整表达</text>

  <rect class="svg" x="290" y="670" width="620" height="120" rx="16"/>
  <text class="audience" x="600" y="701" fill="#9a6810">给人类理解</text>
  <text class="label" x="600" y="734">再提炼易懂的 workflow.svg</text>
  <text class="detail" x="600" y="761">合并工程细节，但保留不同路径、门槛与结果</text>

  <rect class="done" x="350" y="830" width="500" height="126" rx="14"/>
  <text class="label" x="600" y="869">双重校验并交付</text>
  <text class="detail" x="600" y="896">确认 Markdown 精确、SVG 易懂、两者语义一致</text>
  <text class="detail" x="600" y="920">报告版本变化与验证结果</text>
</svg>
