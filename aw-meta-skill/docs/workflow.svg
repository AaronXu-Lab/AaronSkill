<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1340" role="img" aria-labelledby="title desc">
<title id="title">AW Meta Skill 工作流程</title>
<desc id="desc">明确范围与基础规范并检查版本授权；新建或聚焦更新，落实目标 Skill 的描述、按需加载、授权与完成标准等编写准则。先维护文本工作流，按需更新或复核 SVG，否则复用有效视觉证据。双校验与相关检查通过后交付，失败则修复或报告阻塞。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#52606d"/></marker>
<style>
.canvas{fill:#f7f9fb}.title{font:700 30px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#1f2933;text-anchor:middle}.label{font:600 18px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#1f2933;text-anchor:middle}.detail{font:400 14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#52606d;text-anchor:middle}.input{fill:#ffffff;stroke:#9eacb8;stroke-width:2}.step{fill:#edf6ff;stroke:#287bbb;stroke-width:2}.gate{fill:#fff7e6;stroke:#c98312;stroke-width:2}.stop{fill:#fff0ef;stroke:#c94b43;stroke-width:2}.done{fill:#edf9f1;stroke:#2e8b54;stroke-width:2}.link{fill:none;stroke:#52606d;stroke-width:2.5;marker-end:url(#arrow)}
</style>
</defs><rect class="canvas" width="1200" height="1340"/>
<text class="title" x="600" y="52">AW Meta Skill</text>
<text class="detail" x="600" y="80">明确范围与授权，维护双工作流，验证后交付</text>
<path class="link" d="M530 180 V210"/>
<path class="link" d="M530 320 V350"/>
<path class="link" d="M780 265 H900"/>
<path class="link" d="M530 420 V450"/>
<path class="link" d="M780 505 H900"/>
<path class="link" d="M530 560 V580 H275 V610"/>
<path class="link" d="M530 580 H735 V610"/>
<path class="link" style="marker-end:none" d="M275 680 V710 H530"/>
<path class="link" style="marker-end:none" d="M735 680 V710 H530"/>
<path class="link" d="M530 710 V740"/>
<path class="link" d="M530 810 V850"/>
<rect class="input" x="280" y="110" width="500" height="70" rx="14"/>
<text class="label" x="530.0" y="139">明确目标与范围</text>
<text class="detail" x="530.0" y="163">读取完整会话，沿用已有授权</text>
<polygon class="gate" points="530,210 780,265 530,320 280,265"/>
<text class="label" x="530" y="261">基础规范可用？</text>
<text class="detail" x="530" y="285">首次读取，已有有效内容可复用</text>
<rect class="stop" x="900" y="230" width="260" height="70" rx="14"/>
<text class="label" x="1030.0" y="259">报告依赖缺失</text>
<text class="detail" x="1030.0" y="283">停止，不能凭记忆代替</text>
<text class="detail" x="824" y="253">否</text>
<text class="detail" x="553" y="342">是</text>
<rect class="step" x="280" y="350" width="500" height="70" rx="14"/>
<text class="label" x="530.0" y="379">检查目标与保护项</text>
<text class="detail" x="530.0" y="403">按变更范围读取，保留用户改动</text>
<polygon class="gate" points="530,450 780,505 530,560 280,505"/>
<text class="label" x="530" y="501">需要 MAJOR 且未授权？</text>
<text class="detail" x="530" y="525">在实施不兼容变更之前判断</text>
<rect class="stop" x="900" y="470" width="260" height="70" rx="14"/>
<text class="label" x="1030.0" y="499">确认版本方向</text>
<text class="detail" x="1030.0" y="523">已有相应授权则直接继续</text>
<text class="detail" x="824" y="493">是</text>
<text class="detail" x="553" y="575">否</text>
<text class="detail" x="239" y="598">新建</text>
<text class="detail" x="771" y="598">更新</text>
<rect class="step" x="70" y="610" width="410" height="70" rx="14"/>
<text class="label" x="275.0" y="639">建立最小结构</text>
<text class="detail" x="275.0" y="663">遵守目标平台与仓库契约</text>
<rect class="step" x="550" y="610" width="370" height="70" rx="14"/>
<text class="label" x="735.0" y="639">聚焦修改</text>
<text class="detail" x="735.0" y="663">保留依赖、策略与范围外内容</text>
<rect class="step" x="280" y="740" width="500" height="70" rx="14"/>
<text class="label" x="530.0" y="769">落实编写准则与文本工作流</text>
<text class="detail" x="530.0" y="793">描述明确、资料按需加载、完成标准可验证</text>
<path class="link" d="M780 905 H900"/>
<path class="link" style="marker-end:none" d="M1030 950 V1005 H530"/>
<path class="link" d="M530 960 V1050"/>
<path class="link" d="M780 1105 H900"/>
<path class="link" d="M530 1160 V1210"/>
<polygon class="gate" points="530,850 780,905 530,960 280,905"/>
<text class="label" x="530" y="901">需要更新或复核 SVG？</text>
<text class="detail" x="530" y="925">新图、相关变更、存疑或无有效证据</text>
<text class="detail" x="824" y="893">是</text>
<rect class="step" x="900" y="870" width="260" height="80" rx="14"/>
<text class="label" x="1030" y="899">读取细则并复核</text>
<text class="detail" x="1030" y="923">按需同步图，渲染检查</text>
<text class="detail" x="653" y="982">否 · 复用有效视觉证据</text>
<polygon class="gate" points="530,1050 780,1105 530,1160 280,1105"/>
<text class="label" x="530" y="1101">必要检查通过？</text>
<text class="detail" x="530" y="1125">双校验与变更相关的检查</text>
<rect class="stop" x="900" y="1070" width="260" height="80" rx="14"/>
<text class="label" x="1030" y="1099">修复或报告阻塞</text>
<text class="detail" x="1030" y="1123">修复后重验；未通过不报完成</text>
<text class="detail" x="824" y="1093">否</text>
<text class="detail" x="553" y="1190">是</text>
<rect class="done" x="280" y="1210" width="500" height="90" rx="14"/>
<text class="label" x="530" y="1239">检查保护项并交付</text>
<text class="detail" x="530" y="1263">报告旧 → 新版本、元数据和验证证据</text>
</svg>
