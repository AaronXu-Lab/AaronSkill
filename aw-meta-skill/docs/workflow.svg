<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">AW Meta Skill 工作流程</title>
  <desc id="desc">先加载 skill-creator 基础规范，判断创建或更新路径，再维护元数据与流程图，最后执行双重校验并交付。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4b5d6b"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #17212b; }
      .subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #60717f; }
      .label { font: 600 18px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #17212b; text-anchor: middle; }
      .detail { font: 400 14px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #52616d; text-anchor: middle; }
      .branch { font: 700 14px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #52616d; }
      .line { fill: none; stroke: #4b5d6b; stroke-width: 2.5; marker-end: url(#arrow); }
      .step { fill: #ffffff; stroke: #aebbc5; stroke-width: 2; }
      .action { fill: #edf6ff; stroke: #2f7fbd; stroke-width: 2; }
      .decision { fill: #fff7e6; stroke: #c98918; stroke-width: 2.5; }
      .stop { fill: #fff0ef; stroke: #c84e46; stroke-width: 2; }
      .done { fill: #edf9f1; stroke: #2f8b54; stroke-width: 2.5; }
    </style>
  </defs>

  <rect width="1200" height="1200" fill="#f7f9fb"/>
  <text class="title" x="600" y="48" text-anchor="middle">AW Meta Skill</text>
  <text class="subtitle" x="600" y="75" text-anchor="middle">以 skill-creator 为基础，增加元数据与流程图交付门禁</text>

  <rect class="step" x="420" y="105" width="360" height="72" rx="16"/>
  <text class="label" x="600" y="135">接收创建或更新请求</text>
  <text class="detail" x="600" y="159">确认目标路径、用途与范围</text>

  <path class="line" d="M600 177 V215"/>
  <polygon class="decision" points="600,215 790,280 600,345 410,280"/>
  <text class="label" x="600" y="276">skill-creator 可用？</text>
  <text class="detail" x="600" y="301">完整读取基础规范</text>

  <text class="branch" x="817" y="267">否</text>
  <path class="line" d="M790 280 H865"/>
  <rect class="stop" x="865" y="240" width="290" height="80" rx="16"/>
  <text class="label" x="1010" y="273">停止并报告缺失</text>
  <text class="detail" x="1010" y="297">不凭记忆重建基础规则</text>

  <text class="branch" x="616" y="371">是</text>
  <path class="line" d="M600 345 V390"/>
  <polygon class="decision" points="600,390 790,455 600,520 410,455"/>
  <text class="label" x="600" y="451">目标 SKILL 已存在？</text>
  <text class="detail" x="600" y="476">选择聚焦更新或标准初始化</text>

  <text class="branch" x="260" y="442">否：创建</text>
  <path class="line" d="M410 455 H315 V550"/>
  <rect class="action" x="140" y="550" width="350" height="82" rx="16"/>
  <text class="label" x="315" y="582">运行标准初始化器</text>
  <text class="detail" x="315" y="606">建立 SKILL.md 与必要资源</text>

  <text class="branch" x="804" y="442">是：更新</text>
  <path class="line" d="M790 455 H885 V550"/>
  <rect class="action" x="710" y="550" width="350" height="82" rx="16"/>
  <text class="label" x="885" y="582">检查现有结构与调用方</text>
  <text class="detail" x="885" y="606">保留无关字段、资源和策略</text>

  <path class="line" d="M315 632 V670 H600 V700"/>
  <path class="line" d="M885 632 V670 H600"/>
  <rect class="action" x="400" y="700" width="400" height="86" rx="16"/>
  <text class="label" x="600" y="733">编写或修订目标 SKILL</text>
  <text class="detail" x="600" y="759">遵循基础规范与用户真实用途</text>

  <path class="line" d="M600 786 V825"/>
  <rect class="action" x="400" y="825" width="400" height="86" rx="16"/>
  <text class="label" x="600" y="858">维护 metadata</text>
  <text class="detail" x="600" y="884">version · author · creation_context</text>

  <path class="line" d="M600 911 V950"/>
  <rect class="action" x="400" y="950" width="400" height="86" rx="16"/>
  <text class="label" x="600" y="983">创建或同步 workflow.svg</text>
  <text class="detail" x="600" y="1009">阶段、判断、停止条件与产物保持一致</text>

  <path class="line" d="M600 1036 V1070"/>
  <rect class="step" x="400" y="1070" width="400" height="72" rx="16"/>
  <text class="label" x="600" y="1100">基础校验 + AW 附加校验</text>
  <text class="detail" x="600" y="1124">人工复核语义、版本与 UI metadata</text>

  <path class="line" d="M600 1142 V1160"/>
  <rect class="done" x="470" y="1160" width="260" height="36" rx="18"/>
  <text class="label" x="600" y="1184">完成并报告</text>
</svg>
