<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1635" role="img" aria-labelledby="title desc">
  <title id="title">分档任务派发流程</title>
  <desc id="desc">主会话直接完成讨论和只读研究；实施任务的方向与边界未明确时先在主会话讨论；明确后依据剩余不确定性、影响范围和协调复杂度从低档起评，已定方案的局部执行适合低档，仍需实质性设计判断或相关实现协调适合中档，再衡量关联历史能否显著减少理解成本或衔接风险，按本次任务和上下文收益选择会话，建立、恢复及每次派发均依据平台证据解析同系列最新可用模型，用户指定优先；旧会话仅在能力与授权允许时更新，无法确认则停止受影响操作。由执行会话自行校验并报告。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#52606d"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#203040;text-anchor:middle}
      .heading{font-size:30px;font-weight:700}.node{font-size:18px;font-weight:600}.sub{font-size:14px;font-weight:400}.edge{fill:none;stroke:#52606d;stroke-width:2.5;marker-end:url(#arrow)}
      .input{fill:#fff;stroke:#9eacb8}.stage{fill:#edf6ff;stroke:#287bbb}.decision{fill:#fff7e6;stroke:#c98312}.stop{fill:#fff0ef;stroke:#c94b43}.done{fill:#edf9f1;stroke:#2e8b54}
    </style>
  </defs>
  <rect width="1200" height="1635" fill="#f7f9fb"/>
  <text x="600" y="55" class="heading">分档任务派发</text>
  <rect x="410" y="90" width="380" height="70" rx="14" class="input" stroke-width="2"/>
  <text x="600" y="120" class="node">用户显式调用</text><text x="600" y="143" class="sub">当前会话担任主会话</text>
  <path d="M600 160 V196" class="edge"/>
  <polygon points="600,195 775,260 600,325 425,260" class="decision" stroke-width="2"/>
  <text x="600" y="253" class="node">要求建立或实际实施？</text><text x="600" y="276" class="sub">只读查询和分析留在主会话</text>
  <path d="M425 260 H215 V370" class="edge"/><text x="335" y="248" class="sub">否</text>
  <rect x="45" y="370" width="340" height="65" rx="14" class="done" stroke-width="2"/><text x="215" y="410" class="node">主会话调查并直接回答</text>
  <path d="M600 325 V370" class="edge"/><text x="622" y="351" class="sub">是</text>
  <rect x="410" y="370" width="380" height="70" rx="14" class="stage" stroke-width="2"/>
  <text x="600" y="400" class="node">确认平台、项目、授权与映射</text><text x="600" y="423" class="sub">按平台证据解析系列最新；用户指定优先</text>
  <path d="M600 440 V476" class="edge"/>
  <polygon points="600,475 775,540 600,605 425,540" class="decision" stroke-width="2"/>
  <text x="600" y="532" class="node">模型、强度与会话可确认？</text><text x="600" y="555" class="sub">缺失档位仅在已获授权时建立</text>
  <path d="M775 540 H1000 V630" class="edge"/><text x="860" y="528" class="sub">否</text>
  <rect x="840" y="630" width="320" height="70" rx="14" class="stop" stroke-width="2"/>
  <text x="1000" y="660" class="node">说明阻塞并请用户决定</text><text x="1000" y="683" class="sub">不自行替换配置</text>
  <path d="M600 605 V640" class="edge"/><text x="622" y="623" class="sub">是</text>
  <polygon points="600,640 795,705 600,770 405,705" class="decision" stroke-width="2"/>
  <text x="600" y="698" class="node">实施方向与边界已明确？</text><text x="600" y="721" class="sub">关键方案未定先在主会话讨论</text>
  <path d="M405 705 H385" class="edge"/><text x="395" y="688" class="sub">否</text>
  <rect x="45" y="670" width="340" height="70" rx="14" class="stage" stroke-width="2"/>
  <text x="215" y="700" class="node">主会话继续澄清关键方案</text><text x="215" y="723" class="sub">明确后再定档，不直接派未定方案</text>
  <path d="M600 770 V805" class="edge"/><text x="622" y="792" class="sub">是</text>
  <rect x="380" y="805" width="440" height="70" rx="14" class="stage" stroke-width="2"/>
  <text x="600" y="835" class="node">按不确定性、影响与协调从低档起评</text><text x="600" y="858" class="sub">已定局部低档；实质设计中档；结构重构高档</text>
  <path d="M600 875 V915" class="edge"/>
  <polygon points="600,915 810,990 600,1065 390,990" class="decision" stroke-width="2"/>
  <text x="600" y="982" class="node">历史上下文有显著收益？</text><text x="600" y="1005" class="sub">减少理解成本、衔接或迁移风险</text>
  <path d="M390 990 H235 V1105" class="edge"/><text x="330" y="975" class="sub">是且适合</text>
  <rect x="65" y="1105" width="340" height="75" rx="14" class="stage" stroke-width="2"/>
  <text x="235" y="1135" class="node">考虑复用原会话</text><text x="235" y="1158" class="sub">说明本次档位与上下文收益</text>
  <path d="M600 1065 V1105" class="edge"/><text x="660" y="1088" class="sub">无或不足</text>
  <rect x="435" y="1105" width="350" height="75" rx="14" class="stage" stroke-width="2"/>
  <text x="610" y="1135" class="node">选择当前档位会话</text><text x="610" y="1158" class="sub">简单后续任务可降档</text>
  <path d="M235 1180 V1205 H600" fill="none" stroke="#52606d" stroke-width="2.5"/>
  <path d="M600 1180 V1205" fill="none" stroke="#52606d" stroke-width="2.5"/>
  <path d="M600 1205 V1235" class="edge"/>
  <rect x="380" y="1235" width="440" height="70" rx="14" class="stage" stroke-width="2"/>
  <text x="600" y="1265" class="node">派发前重核目标与实际配置</text><text x="600" y="1288" class="sub">旧映射不锁版本；保留用户显式配置</text>
  <path d="M600 1305 V1335" class="edge"/>
  <polygon points="600,1335 810,1405 600,1475 390,1405" class="decision" stroke-width="2"/>
  <text x="600" y="1397" class="node">配置一致或可授权更新？</text><text x="600" y="1420" class="sub">平台须保证本次实际生效配置</text>
  <path d="M810 1405 H880" class="edge"/><text x="845" y="1393" class="sub">否</text>
  <rect x="880" y="1370" width="285" height="70" rx="14" class="stop" stroke-width="2"/>
  <text x="1022" y="1400" class="node">暂停受影响的派发</text><text x="1022" y="1423" class="sub">报告缺口，等待必要决定</text>
  <path d="M600 1475 V1510" class="edge"/><text x="622" y="1497" class="sub">是</text>
  <rect x="380" y="1510" width="440" height="70" rx="14" class="done" stroke-width="2"/>
  <text x="600" y="1540" class="node">应用配置并派发，执行会话自行校验</text><text x="600" y="1563" class="sub">报告实际模型、配置变化与实施结果</text>
</svg>
