<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1450" viewBox="0 0 1200 1450" role="img" aria-labelledby="title desc">
  <title id="title">UI/UX 信息冗余审计工作流程</title>
  <desc id="desc">限定请求范围，在当前证据充分的部分映射事实并判断价值，未知部分保留待验证。核对必要语义后，局部问题简短交付，完整审计使用九项报告。只审查时完成报告；沿用完整会话实施授权，修改并验证，发现语义问题返回映射，检查失败或不可用时交付验证缺口。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#52606d"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; text-anchor: middle; fill: #17212b; }
      .title { font-size: 30px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 600; }
      .detail, .branch { font-size: 14px; font-weight: 400; fill: #52606d; }
      .line { fill: none; stroke: #52606d; stroke-width: 2.5; marker-end: url(#arrow); }
      .route { fill: none; stroke: #52606d; stroke-width: 2.5; }
      .input { fill: #ffffff; stroke: #9eacb8; stroke-width: 2; }
      .action { fill: #edf6ff; stroke: #287bbb; stroke-width: 2; }
      .decision { fill: #fff7e6; stroke: #c98312; stroke-width: 2; }
      .stop { fill: #fff0ef; stroke: #c94b43; stroke-width: 2; }
      .done { fill: #edf9f1; stroke: #2e8b54; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1200" height="1450" fill="#f7f9fb"/>
  <text class="title" x="600" y="48">UI/UX 信息冗余审计</text>
  <text class="detail" x="600" y="78">按任务价值精简信息 · 按请求范围交付 · 沿用已有授权</text>

  <rect class="input" x="400" y="105" width="400" height="75" rx="14"/>
  <text class="label" x="600" y="135">限定用户请求与当前证据</text>
  <text class="detail" x="600" y="160">局部或完整范围 · 对象、状态与证据版本</text>
  <path class="line" d="M600 180 V215"/>
  <polygon class="decision" points="600,215 795,280 600,345 405,280"/>
  <text class="label" x="600" y="277">有可审计的当前证据？</text>
  <text class="detail" x="600" y="302">部分可知也继续 · 未知部分待验证</text>
  <path class="line" d="M795 280 H865"/>
  <text class="branch" x="830" y="266">无</text>
  <rect class="stop" x="865" y="240" width="290" height="80" rx="14"/>
  <text class="label" x="1010" y="271">索取最小材料</text>
  <text class="detail" x="1010" y="298">整个目标未知时暂停结论</text>
  <path class="line" d="M600 345 V390"/>
  <text class="branch" x="660" y="372">全部或部分</text>

  <rect class="action" x="400" y="390" width="400" height="80" rx="14"/>
  <text class="label" x="600" y="422">映射事实并判断信息价值</text>
  <text class="detail" x="600" y="448">出现位置 · 条件与阶段 · 重复的独立作用</text>
  <path class="line" d="M600 470 V505"/>
  <rect class="action" x="400" y="505" width="400" height="80" rx="14"/>
  <text class="label" x="600" y="537">作出决策并推荐最小改动</text>
  <text class="detail" x="600" y="563">标准位置 · 缺口与待验证项 · 先语义后布局</text>
  <path class="line" d="M600 585 V625"/>
  <polygon class="decision" points="600,625 795,690 600,755 405,690"/>
  <text class="label" x="600" y="687">方案保留必要语义？</text>
  <text class="detail" x="600" y="712">必要语义保留 · 未知用途不删</text>
  <path class="route" d="M405 690 H265 V430"/>
  <circle cx="265" cy="430" r="4" fill="#52606d"/>
  <path class="line" d="M265 430 H400"/>
  <text class="branch" x="320" y="676">否：修正映射</text>
  <path class="line" d="M600 755 V795"/>
  <text class="branch" x="620" y="782">是</text>

  <rect class="action" x="400" y="795" width="400" height="80" rx="14"/>
  <text class="label" x="600" y="827">按请求范围交付审计</text>
  <text class="detail" x="600" y="853">局部：简短结论 · 完整：九项报告</text>
  <path class="line" d="M600 875 V915"/>
  <polygon class="decision" points="600,915 795,980 600,1045 405,980"/>
  <text class="label" x="600" y="977">完整会话已授权实施？</text>
  <text class="detail" x="600" y="1002">先审计 · 沿用已有授权</text>
  <path class="line" d="M795 980 H865"/>
  <text class="branch" x="830" y="966">否</text>
  <rect class="done" x="865" y="940" width="290" height="80" rx="14"/>
  <text class="label" x="1010" y="972">完成审计报告</text>
  <text class="detail" x="1010" y="998">建议与未执行检查明确区分</text>
  <path class="line" d="M600 1045 V1085"/>
  <text class="branch" x="620" y="1072">是</text>

  <rect class="action" x="400" y="1085" width="400" height="80" rx="14"/>
  <text class="label" x="600" y="1117">实施并执行相关验证</text>
  <text class="detail" x="600" y="1143">按需读取实施细则 · 修复并重验受影响路径</text>
  <path class="route" d="M400 1125 H120 V430 H265"/>
  <text class="branch" x="235" y="1110">语义问题：返回映射</text>
  <path class="line" d="M600 1165 V1205"/>
  <polygon class="decision" points="600,1205 795,1270 600,1335 405,1270"/>
  <text class="label" x="600" y="1267">相关检查实际通过？</text>
  <text class="detail" x="600" y="1292">方案推演不能代替实测</text>
  <path class="line" d="M795 1270 H865"/>
  <text class="branch" x="830" y="1256">否</text>
  <rect class="stop" x="865" y="1230" width="290" height="80" rx="14"/>
  <text class="label" x="1010" y="1262">交付改动与验证缺口</text>
  <text class="detail" x="1010" y="1288">检查失败或不可用 · 保留证据</text>
  <path class="line" d="M600 1335 V1370"/>
  <text class="branch" x="620" y="1359">是</text>
  <rect class="done" x="400" y="1370" width="400" height="55" rx="14"/>
  <text class="label" x="600" y="1404">交付改动与明确验证范围</text>
</svg>
