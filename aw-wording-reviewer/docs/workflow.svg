<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1430" role="img" aria-labelledby="title desc">
<title id="title">AW Wording Reviewer 工作流程</title>
<desc id="desc">先确定简体中文审查范围和已有授权，再按任务读取相关规则。片段直接审查，源码按范围运行机械检查并复核语义；仅预检时提前交付。只审查则报告，已授权修改则完成修改与复验。时间接入有独立授权边界，缺少接入授权不阻断已有审查。无法验证时报告具体缺口。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#52606d"/></marker>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;text-anchor:middle;fill:#17212b}.title{font-size:30px;font-weight:700}.label{font-size:18px;font-weight:600}.note{font-size:14px;font-weight:400;fill:#52606d}.input{fill:#fff;stroke:#9eacb8}.step{fill:#edf6ff;stroke:#287bbb}.decision{fill:#fff7e6;stroke:#c98312}.stop{fill:#fff0ef;stroke:#c94b43}.result{fill:#edf9f1;stroke:#2e8b54}rect,polygon{stroke-width:2}.line{fill:none;stroke:#52606d;stroke-width:2.5;marker-end:url(#arrow)}.join{fill:none;stroke:#52606d;stroke-width:2.5}
</style></defs>
<rect width="1200" height="1430" fill="#f7f9fb" stroke="none"/>
<text class="title" x="600" y="48">AW Wording Reviewer</text>
<rect class="input" x="390" y="80" width="420" height="68" rx="14"/><text class="label" x="600" y="108">确定审查范围与已有授权</text><text class="note" x="600" y="131">先看用户目标 · 保留规则选择与项目边界</text>
<path class="line" d="M600 148V178"/>
<polygon class="decision" points="600,178 790,232 600,286 410,232"/><text class="label" x="600" y="238">范围明确且适用？</text>
<path class="line" d="M790 232H870"/><text class="note" x="832" y="218">否</text>
<rect class="stop" x="870" y="198" width="280" height="68" rx="14"/><text class="label" x="1010" y="226">说明缺口或不适用</text><text class="note" x="1010" y="249">缺少目标时再澄清</text>
<path class="line" d="M600 286V320"/><text class="note" x="622" y="307">是</text>
<rect class="step" x="390" y="320" width="420" height="68" rx="14"/><text class="label" x="600" y="348">按任务读取规则与相关约束</text><text class="note" x="600" y="371">单句只读相关条目 · 批量任务简述预检</text>
<path class="line" d="M390 354H330"/><text class="note" x="230" y="305">用户仅要求预检</text>
<rect class="result" x="50" y="320" width="280" height="68" rx="14"/><text class="label" x="190" y="348">交付预检</text><text class="note" x="190" y="371">规则、项目例外与范围</text>
<path class="line" d="M600 388V422"/>
<polygon class="decision" points="600,422 790,476 600,530 410,476"/><text class="label" x="600" y="482">本次审查哪类输入？</text>
<path class="line" d="M410 476H250V562"/><text class="note" x="300" y="460">单句 / 截图</text>
<path class="line" d="M790 476H950V562"/><text class="note" x="905" y="460">文件 / 批量源码</text>
<rect class="step" x="70" y="562" width="360" height="68" rx="14"/><text class="label" x="250" y="590">直接审查可见文案</text><text class="note" x="250" y="613">按角色与所选规则判断</text>
<rect class="step" x="770" y="562" width="360" height="68" rx="14"/><text class="label" x="950" y="590">扫描源码并补充语义复核</text><text class="note" x="950" y="613">仅适用机械项运行扫描器</text>
<path class="join" d="M250 630V666H950V630"/><path class="line" d="M600 666V702"/>
<rect class="step" x="390" y="702" width="420" height="68" rx="14"/><text class="label" x="600" y="730">需要时核对实现与显示</text><text class="note" x="600" y="753">动态展示查调用链 · 缺少事实标记未知</text>
<path class="line" d="M600 770V810"/>
<polygon class="decision" points="600,810 790,864 600,918 410,864"/><text class="label" x="600" y="870">已有对应修改授权？</text>
<path class="line" d="M410 864H330"/><text class="note" x="367" y="850">否</text>
<rect class="result" x="50" y="830" width="280" height="68" rx="14"/><text class="label" x="190" y="858">交付有依据的审查结果</text><text class="note" x="190" y="881">位置、原文、改写与规则</text>
<path class="line" d="M600 918V958"/><text class="note" x="621" y="944">是</text>
<rect class="step" x="390" y="958" width="420" height="68" rx="14"/><text class="label" x="600" y="986">应用范围内的文案修改</text><text class="note" x="600" y="1009">保留 key、插值与其他语言</text>
<path class="line" d="M600 1026V1064"/>
<polygon class="decision" points="600,1064 810,1124 600,1184 390,1124"/><text class="label" x="600" y="1120">需要且已授权时间接入？</text><text class="note" x="600" y="1144">仅改字符串不包含接入</text>
<path class="line" d="M810 1124H870"/><text class="note" x="839" y="1110">是</text>
<rect class="step" x="870" y="1090" width="280" height="68" rx="14"/><text class="label" x="1010" y="1118">接入统一格式化器</text><text class="note" x="1010" y="1141">调整已授权的工具函数与调用</text>
<path class="join" d="M1010 1158V1220H600"/><path class="join" d="M600 1184V1220"/><text class="note" x="622" y="1203">否</text><text class="note" x="354" y="1210">仅需要时报告待授权接入，不阻断交付</text>
<path class="line" d="M600 1220V1256"/>
<rect class="result" x="390" y="1256" width="420" height="78" rx="14"/><text class="label" x="600" y="1286">完成相关验证并交付</text><text class="note" x="600" y="1311">修复本次问题 · 说明未修项与验证缺口</text>
<text class="note" x="600" y="1390">已获授权的修改持续到验证完成；必要检查失败时说明阻塞，不虚报通过</text>
</svg>
