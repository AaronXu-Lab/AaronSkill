<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1030" role="img" aria-labelledby="title desc"><title id="title">本地多服务启动与故障定位</title><desc id="desc">识别入口并观察现场；只诊断时交付原因，否则按现有授权启动修复，验证服务调用链和目标页面。不能继续时报告阻塞。</desc>
