<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1030" role="img" aria-labelledby="title desc"><title id="title">PRD 需求查证与界面对照</title><desc id="desc">定位适用来源；依据不足时交付已知部分。读条款后按请求回答或对照，已有授权且依据充分时修正并复查。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#263642;text-anchor:middle} .heading{font-size:30px;font-weight:700}.label{font-size:18px;font-weight:600}.note{font-size:14px;font-weight:400}.edge{fill:none;stroke:#52606d;stroke-width:2.5;marker-end:url(#arrow)}</style>
